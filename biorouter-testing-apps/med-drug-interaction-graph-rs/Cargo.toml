[package]
name = "med-drug-interaction-graph-rs"
version = "0.1.0"
edition = "2021"
description = "A drug-drug interaction graph engine in Rust"
authors = ["BioRouter Lab"]
license = "MIT"

[workspace]

[[bin]]
name = "ddi-graph"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
petgraph = "0.6"
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
