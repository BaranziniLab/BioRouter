[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-motif-finder-py"
version = "0.1.0"
description = "DNA motif-discovery toolkit with multiple algorithms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "BioRouter", email = "biorouter@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
motif-finder = "bio_motif_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_motif_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["bio_motif_finder"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
