[package]
name = "algo-bloom-cuckoo-filters-rs"
version = "0.1.0"
edition = "2021"
description = "Probabilistic data structures in Rust: Bloom, Counting Bloom, Cuckoo, and Scalable Bloom filters"
license = "MIT"
readme = "README.md"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
