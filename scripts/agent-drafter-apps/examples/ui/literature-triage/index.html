<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Literature Triage</title>
</head>
<body>
  <main class="br-container" data-br-main>
    <span class="br-badge">Biorouter App</span>
    <h1>Literature Triage</h1>
    <p style="color: var(--br-text-muted); margin-top: 2px;">
      Paste abstracts, name what makes one relevant, and screen the queue that appears in
      the dock — include or exclude with a click, no re-prompting.
    </p>

    <div class="br-card">
      <label class="br-label" for="question">Review question</label>
      <input
        id="question"
        class="br-input"
        placeholder="e.g. RCTs of GLP-1 agonists reporting cardiovascular outcomes"
      />
      <label class="br-label" for="abstracts" style="margin-top: 12px;">Abstracts</label>
      <textarea
        id="abstracts"
        class="br-textarea"
        style="min-height: 200px;"
        placeholder="Paste one or more abstracts, separated by a blank line…"
      ></textarea>
      <div class="br-row" style="margin-top: 12px;">
        <button id="triage-btn" class="br-btn" style="flex: 0 0 auto;">Triage abstracts</button>
        <div id="status" class="br-slider-val" style="align-self: center;"></div>
      </div>
    </div>

    <h2>Decision summary</h2>
    <!-- The agent renders the running Included / Excluded / Undecided tally here. -->
    <section data-br-region="summary" class="br-panel">
      <span style="color: var(--br-text-muted);">Counts appear once the queue is built.</span>
    </section>

    <h2>Agent log</h2>
    <div id="out" class="br-output" data-placeholder="The agent's screening notes stream here; the queue itself opens in the dock on the right."></div>

    <p class="br-footer">Powered by Biorouter · built with Agent Drafter</p>
  </main>
</body>
</html>
