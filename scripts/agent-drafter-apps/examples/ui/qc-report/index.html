<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sequencing QC Report</title>
</head>
<body>
  <main class="br-container" data-br-main>
    <div class="br-row" style="align-items: center; justify-content: space-between;">
      <div style="flex: 3">
        <span class="br-badge">BioRouter App</span>
        <h1>Sequencing QC Report</h1>
      </div>
      <!-- Reflects the agent's verdict: it flips as the agent recolors the page. -->
      <span class="br-badge" id="mood" style="flex: 0 0 auto">Idle</span>
    </div>
    <p style="color: var(--br-text-muted); margin-top: 2px;">
      Paste one sample's QC metrics. The agent scores each against assay thresholds,
      builds a scorecard, and recolors this page to match its verdict.
    </p>

    <div class="br-card">
      <label class="br-label" for="assay">Assay</label>
      <select id="assay" class="br-select">
        <option value="RNA-seq">RNA-seq (bulk)</option>
        <option value="scRNA-seq">scRNA-seq</option>
        <option value="WGS/WES">WGS / WES</option>
        <option value="ChIP-seq">ChIP-seq / ATAC-seq</option>
        <option value="Generic">Generic</option>
      </select>

      <label class="br-label" for="metrics" style="margin-top: 12px;">Metrics — one per line, <code>name: value</code></label>
      <textarea id="metrics" class="br-textarea" rows="8" spellcheck="false">sample: HEP-04
total_reads: 38.2M
q30: 91.4%
duplication: 34.8%
gc_content: 49.1%
rRNA_fraction: 22.6%
mapping_rate: 88.2%
insert_size: 187 bp</textarea>

      <div class="br-row" style="margin-top: 12px;">
        <button id="run" class="br-btn" style="flex: 0 0 auto">Evaluate QC</button>
        <span style="flex: 1"></span>
      </div>
    </div>

    <!-- Agent render target: the ui_render scorecard (stat tiles + progress bars). -->
    <section data-br-region="scorecard"></section>

    <div class="br-output" id="out" data-placeholder="The verdict and the metric that drove it will stream here."></div>

    <p class="br-footer">Powered by BioRouter · built with Agent Drafter</p>
  </main>
</body>
</html>
