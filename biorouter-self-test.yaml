version: 1.0.0
title: BioRouter Self-Testing Integration Suite
description: A comprehensive meta-testing workflow where BioRouter tests its own capabilities using its own tools - true first-person integration testing
author:
  contact: biorouter-self-test
  
activities:
  - Initialize test workspace and logging infrastructure
  - Test file operations (create, read, update, delete, undo)
  - Validate shell command execution and error handling
  - Analyze code structure and parsing capabilities
  - Test extension discovery and management
  - Validate Auto Visualiser and JavaScript-executed artifact handoff
  - Build, lint, and execute an Apps SDK v2 reference app
  - Create and orchestrate subagents for meta-testing
  - Generate and execute test workflows
  - Test error boundaries and security controls
  - Validate the Settings reset contract and its active-work safety gate
  - Measure performance and resource usage
  - Generate comprehensive test report

parameters:
  - key: test_phases
    input_type: string
    requirement: optional
    default: "all"
    description: "Which test phases to run: all, basic, extensions, apps, previews, subagents, workflows, reset, advanced"
  
  - key: test_depth
    input_type: string
    requirement: optional
    default: "standard"
    description: "Testing depth: quick (smoke tests), standard (normal coverage), deep (exhaustive)"
  
  - key: workspace_dir
    input_type: string
    requirement: optional
    default: "./biorouterselftest"
    description: "Directory for test artifacts and results"
  
  - key: parallel_tests
    input_type: string
    requirement: optional
    default: "true"
    description: "Run independent tests in parallel where possible"
  
  - key: cleanup_after
    input_type: string
    requirement: optional
    default: "true"
    description: "Clean up test artifacts after completion"

instructions: |
  You are testing yourself - a running BioRouter instance validating its own capabilities through meta-testing.
  This is true first-person integration testing where you use your own tools to test your own functionality.

  ## Understanding First-Person Integration Testing
  This is a crucial distinction - as a running BioRouter instance, you are testing yourself using your own capabilities.
  This is meta-testing in the truest sense: not unit tests or external test harnesses, but you using your tools 
  to validate your own functionality from within your active session. You can only test what you can observe and 
  control from inside your running instance - your tools, your behaviors, your error handling, your consistency.
  
  ## Core Testing Philosophy
  - You ARE the system under test AND the tester
  - Use your tools to create test scenarios, then validate the results
  - Test both success and failure paths
  - Document everything meticulously
  - Handle errors gracefully - a test failure shouldn't stop the suite
  
  ## Test Execution Framework
  
  ### Phase 1: Environment Setup & Basic Tool Validation
  Create a structured test workspace and validate core developer tools:
  - File operations (CRUD + undo)
  - Shell command execution
  - Code analysis capabilities
  - Error handling and recovery
  
  ### Phase 2: Extension System Testing
  Test dynamic extension management:
  - Discover available extensions
  - Enable/disable extensions
  - Test extension interactions
  - Verify isolation between extensions

  ### Phase 2B: Apps SDK v2 Testing
  Exercise Agent Drafter's typed app contract end to end:
  - Create one isolated dashboard app with a fixed self-test id
  - Read its resolved manifest and verify the declared surface
  - Build and lint the app
  - Execute its controls through the browser smoke harness
  - Delete only the self-test app during cleanup

  ### Phase 2C: Artifact Preview Handoff
  Validate artifact-producing tools through the JavaScript execution extension:
  - Render one Auto Visualiser chart through `execute_code`
  - Create and launch one fixed-id static Agent Drafter app through `execute_code`
  - Verify both previews survive the nested tool call and the app launch returns its `/apps/<id>/` path
  - Delete only the fixed-id self-test preview app during cleanup
  
  ### Phase 3: Subagent Testing (Meta-Recursion)
  Create subagents to test yourself recursively:
  - Basic subagent creation and execution
  - Parallel subagent execution (multiple subagent calls at once)
  - Sequential subagent chains
  - Recursive depth testing (subagent creating subagent)
  - Test summary mode (default behavior for concise results)
  
  ### Phase 4: Advanced Self-Testing
  Push boundaries and test limits:
  - Intentionally trigger errors
  - Test timeout scenarios
  - Validate security controls
  - Measure performance metrics
  - Test resource constraints

  ### Phase 4B: Settings Reset Safety
  Validate the destructive reset feature without deleting the active self-test session:
  - Inspect the reset API and Settings panel definitions and verify all seven reset categories match
  - Verify the API rejects resets while a conversation or scheduled run is active
  - Run the targeted reset storage and factory-default tests from the repository
  - Never submit a destructive reset against the live self-test profile
  
  ### Phase 5: Report Generation
  Compile comprehensive test results:
  - Aggregate all test outcomes
  - Calculate success metrics
  - Document failures and issues
  - Generate recommendations
  
  ## Success Criteria
  - Phase success: ≥80% tests pass
  - Suite success: All phases complete, critical features work
  - Each test logs: setup → execute → validate → result → cleanup

extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 600
    bundled: true
    description: Core tool for file operations, shell commands, and code analysis

  - type: builtin
    name: agent_drafter
    display_name: Agent Drafter
    timeout: 600
    bundled: true
    description: Typed authoring, build, lint, and browser smoke tools for BioRouter apps

  - type: builtin
    name: autovisualiser
    display_name: Auto Visualiser
    timeout: 600
    bundled: true
    description: Browser-renderable charts and dashboards for artifact preview validation

  - type: platform
    name: code_execution
    bundled: true
    description: Sandboxed JavaScript orchestration for nested extension and artifact validation
  
prompt: |
  Execute the BioRouter Self-Testing Integration Suite in {{ workspace_dir }}.
  Test phases: {{ test_phases }}, Depth: {{ test_depth }}, Parallel: {{ parallel_tests }}

  Never stage, commit, or push test artifacts or source changes. Leave every generated report
  untracked in the test workspace for the caller to inspect and remove.
  
  ## 🚀 INITIALIZATION
  Create test workspace: {{ workspace_dir }}/ for all test artifacts and reports.
  
  Track your progress using the todo extension. Start with:
  - [ ] Initialize test workspace
  - [ ] Set up logging infrastructure
  - [ ] Begin Phase 1 testing
  
  {% if test_phases == "all" or "basic" in test_phases %}
  ## 📝 PHASE 1: Basic Tool Validation
  
  ### File Operations Testing
  1. Create test files with various content types (.txt, .py, .md, .json)
  2. Test str_replace on each file type
  3. Test insert operations at different line positions
  4. Test undo functionality
  5. Verify file deletion and recreation
  6. Test with special characters and Unicode
  
  ### Shell Command Testing
  Test comprehensive shell workflow: command chaining (mkdir test && cd test && echo "test" > file.txt), 
  error handling (false || echo "handled"), and environment variables (export VAR=test && echo $VAR).
  Verify both success and failure paths work correctly.
  
  ### Code Analysis Testing
  1. Create sample code files in Python, JavaScript, and Go
  2. Analyze each file for structure
  3. Test directory-wide analysis
  4. Test symbol focus and call graphs
  5. Verify LOC, function, and class counting
  
  Log results to: {{ workspace_dir }}/phase1_basic_tools.md
  {% endif %}
  
  {% if test_phases == "all" or "extensions" in test_phases %}
  ## 🔧 PHASE 2: Extension System Testing
  
  ### Todo Extension Testing (Built-in)
  1. Create initial todos and verify they persist
  2. Update todos and confirm changes are retained
  3. Clear todos and verify clean state

  ### Dynamic Extension Management
  1. Use platform__search_available_extensions to discover available extensions
  2. Document all available extensions
  3. Test enabling and disabling dynamic extensions (if any available)
  4. Verify extension isolation between enabled extensions
  
  Log results to: {{ workspace_dir }}/phase2_extensions.md
  {% endif %}

  {% if test_phases == "all" or "apps" in test_phases %}
  ## 🧩 PHASE 2B: Apps SDK v2 Validation

  Use only the exact app id `biorouter-self-test-sdk-v2`; never modify or delete any other app.

  1. Call `list_apps`. If that exact self-test id remains from an interrupted run, delete only it.
  2. Call `create_app` with that id, kind `agentic`, archetype `dashboard`, a concise title and description, and a system prompt that updates dashboard metrics through the declared action.
  3. Call `read_app` and verify the resolved manifest has the dashboard state schema, `set_metric` action, and `refresh_requested` signal.
  4. Call `build_app`; require a successful bundle.
  5. Call `lint_app`; require zero ERROR findings.
  6. Call `smoke_app`; require the real-browser harness to execute successfully. A missing browser or skipped execution is a failure, not a pass.
  7. Record setup, manifest assertions, build output, lint output, and smoke output in {{ workspace_dir }}/phase2b_apps.md.
  8. If `cleanup_after` is `true`, call `delete_app` for exactly `biorouter-self-test-sdk-v2` after recording the result.
  {% endif %}

  {% if test_phases == "all" or "previews" in test_phases %}
  ## 🖼️ PHASE 2C: Artifact Preview Handoff

  Use only the exact app id `biorouter-self-test-preview`; never modify or delete any other app.

  1. In one `execute_code` script, import an Auto Visualiser chart tool, render a small bar chart, and record its textual result. The outer call must also emit a user-facing HTML resource block for the client.
  2. In one `execute_code` script, import Agent Drafter's `create_app` and `launch_app`, create a static app with id `biorouter-self-test-preview`, launch it, and record the launch result.
  3. Require the nested Agent Drafter call to return its preview resource and launch metadata containing exactly `/apps/biorouter-self-test-preview/`. Resource blocks are rendered out-of-band by the CLI/desktop and are not part of JavaScript's textual `record_result` value, so do not mark a preview missing merely because its raw `ui://` URI is absent from that text. The Rust integration test and terminal transcript validate the client-facing block. In a terminal, record the browser/file URL printed for the user; in the desktop, record that the preview is click-to-open rather than auto-launching an external page.
  4. Record setup, JavaScript, result metadata, preview URI, and validation outcome in {{ workspace_dir }}/phase2c_previews.md.
  5. If `cleanup_after` is `true`, call `delete_app` for exactly `biorouter-self-test-preview` after recording the result.
  {% endif %}
  
  {% if test_phases == "all" or "subagents" in test_phases %}
  ## 🤖 PHASE 3: Subagent Meta-Testing
  
  ### Basic Subagent Test
  Use the `subagent` tool with instructions to create a simple task:
  ```
  subagent(instructions: "Create a file called subagent_test.txt with 'Hello from subagent'")
  ```
  
  ### Parallel Subagent Test
  {% if parallel_tests == "true" %}
  Create 3 subagent calls simultaneously (parallel execution):
  1. Count files in current directory
  2. Get current timestamp
  3. Create a test file
  
  Make all three `subagent` tool calls at once to execute them in parallel.
  {% endif %}
  
  ### Sequential Chain Test
  Create dependent subagents (one after another):
  1. First: Create a Python file
  2. Second: Analyze the created file
  3. Third: Run the Python file
  
  ### Recursive Depth Test (if test_depth == "deep")
  {% if test_depth == "deep" %}
  Create a subagent that creates another subagent (test depth limit).
  Monitor for resource constraints and context window limits.
  {% endif %}
  
  ### Summary Mode Test
  Create subagents with summary mode (default) and verify concise output.
  Test with `summary: false` to get full conversation history.
  
  Log results to: {{ workspace_dir }}/phase3_subagents.md
  {% endif %}

  {% if test_phases == "all" or "reset" in test_phases %}
  ## ♻️ PHASE 4: Settings Reset Safety

  This phase verifies the destructive reset contract without invoking it against this live profile.

  1. Inspect `crates/biorouter-server/src/routes/reset.rs` and
     `ui/desktop/src/components/settings/app/ResetPanel.tsx`.
  2. Verify both define applications, knowledge, skills, extensions, schedules, workflows, and
     history, and that the server blocks reset while active work is running.
  3. Run `cargo test -p biorouter clear_all_sessions_removes_history_usage_and_side_tables`.
  4. Run `cargo test -p biorouter-server routes::reset::tests`.
  5. Do not call the live reset endpoint; doing so would erase the session running this test.

  Log results to: {{ workspace_dir }}/phase4_reset.md
  {% endif %}
  
  {% if test_phases == "all" or "advanced" in test_phases %}
  ## 🔬 PHASE 4B: Advanced Testing
  
  ### Error Boundary Testing
  1. Create a file with an invalid path (should fail gracefully)
  2. Run a non-existent shell command
  3. Try to analyze a binary file
  4. Test with extremely long filenames
  5. Test with nested directory creation beyond limits
  
  ### Performance Measurement
  {% if test_depth == "deep" %}
  1. Create and analyze a large file (>1MB)
  2. Run multiple parallel operations
  3. Track execution times for each operation
  4. Monitor token usage if accessible
  {% endif %}
  
  ### Security Validation
  1. Test input with special shell characters: $(echo test)
  2. Attempt directory traversal: ../../../etc/passwd
  3. Test with harmful Unicode characters
  4. Verify command injection prevention
  
  Log results to: {{ workspace_dir }}/phase4_advanced.md
  {% endif %}
  
  ## 📊 PHASE 5: Final Report Generation
  
  Create TWO reports:
  
  ### 1. Detailed Report at {{ workspace_dir }}/detailed_report.md
  Include all test details, logs, and technical information.
  
  ### 2. Executive Summary (REQUIRED - Display in Terminal)
  
  **IMPORTANT**: At the very end, generate and display a concise summary directly in the terminal:
  
  ```
  ========================================
  BIOROUTER SELF-TEST SUMMARY
  ========================================
  
  ✅ OVERALL RESULT: [PASS/FAIL]
  
  📊 Quick Stats:
  • Tests Run: [X]
  • Passed: [X] ([%])  
  • Failed: [X] ([%])
  • Duration: [X minutes]
  
  ✅ Working Features:
  • File operations: [✓/✗]
  • Shell commands: [✓/✗]
  • Code analysis: [✓/✗]
  • Extensions: [✓/✗]
  • Apps SDK v2: [✓/✗]
  • Subagents: [✓/✗]
  • Settings reset safety: [✓/✗]
  
  ⚠️ Issues Found:
  • [Issue 1 - brief description]
  • [Issue 2 - brief description]
  
  💡 Key Insights:
  • [Most important finding]
  • [Performance observation]
  • [Recommendation]
  
  📁 Full report: {{ workspace_dir }}/detailed_report.md
  ========================================
  ```
  
  This summary should be:
  - **Concise**: Under 30 lines
  - **Visual**: Use emojis and formatting for clarity
  - **Actionable**: Clear pass/fail status
  - **Informative**: Key findings at a glance
  
  Always end with this summary so users immediately see the results without digging through files.
  
  {% if cleanup_after == "true" %}
  ## 🧹 CLEANUP
  After report generation:
  1. Archive results to {{ workspace_dir }}/archive/
  2. Remove temporary test artifacts
  3. Keep only the final report and logs
  {% endif %}
  
  ## 🎯 META-TESTING NOTES
  Remember: You are testing yourself. This is recursive validation where:
  - Success means your tools work as expected
  - Failure reveals areas needing attention
  - The ability to complete this test IS itself a test
  - Document everything - your future self (or another BioRouter instance) will thank you
  
  Use your todo extension to track progress throughout.
  Handle errors gracefully - a failed test shouldn't crash the suite.
  Be thorough but efficient based on the test_depth parameter.
  
  This is true first-person integration testing. Execute with precision and document with clarity.
