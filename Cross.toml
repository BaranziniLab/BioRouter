# Configuration for cross-compiling using cross
[build.env]
passthrough = [ "CC" ]

[target.aarch64-unknown-linux-gnu]
xargo = false
pre-build = [
    # Add the ARM64 architecture and install necessary dependencies
    "dpkg --add-architecture arm64",
    """\
    apt-get update --fix-missing && apt-get install -y \
     curl \
     unzip \
     pkg-config \
     libssl-dev:arm64 \
     libdbus-1-dev:arm64 \
     libxcb1-dev:arm64 \
     gcc-10
    """
]

[target.x86_64-unknown-linux-gnu]
xargo = false
pre-build = [
    # ⚠ Debian 11 (bullseye) has passed its LTS end, so `deb.debian.org` no
    # longer serves the -security pool for it: `libssl1.1` and `linux-libc-dev`
    # 404 and the whole install aborts. The packages are on archive.debian.org.
    #
    # The image pin is NOT the thing to change here. `LINUX_RUST_IMG` is
    # bullseye on purpose — it is what holds the GLIBC_2.31 floor that Debian 11
    # / Ubuntu 22.04 / Rocky 9 users depend on, and `assert_glibc_floor` fails
    # the build if it moves. Repointing apt keeps the floor and fixes the fetch.
    #
    # Archived Release files are past their Valid-Until, hence the override.
    """\
    sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g; s|http://security.debian.org|http://archive.debian.org|g' /etc/apt/sources.list && \
    printf 'Acquire::Check-Valid-Until "false";\\n' > /etc/apt/apt.conf.d/99no-check-valid-until
    """,
    """\
    apt-get update && apt-get install -y \
     curl \
     unzip \
     pkg-config \
     libssl-dev \
     libdbus-1-dev \
     libxcb1-dev \
     gcc-10
    """
]

[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:latest"
env = { "RUST_LOG" = "debug", "RUST_BACKTRACE" = "1", "CROSS_VERBOSE" = "1", "PKG_CONFIG_ALLOW_CROSS" = "1" }
pre-build = [
    """\
    apt-get update && apt-get install -y \
     curl \
     unzip
    """
]
