<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BioRouter BR menu-bar mark">
  <!--
    ============================================================================
    macOS menu-bar TEMPLATE source - MONOCHROME BR.
      A template image is black shapes on a transparent background; macOS tints
      it to the menu-bar colour using the alpha channel (the RGB is masked out).
      So the navy B + coral R of the app icon collapse to one solid black fill
      here, plus the split underline, over a transparent (plate-less) canvas.
    ============================================================================
    HOW THE SHIPPED TEMPLATE RASTERS ARE BUILT (read before touching prepare.sh):
      iconTemplate{,@2x}.png and iconTemplateUpdate{,@2x}.png (22/44 px) are
      sips-resized from br-glyph-mono.png, the browser-rendered 1024 monochrome
      master, NOT rasterized from THIS svg via sips. sips renders SVG <text> but
      FLATTENS font-weight (heavy-800 comes out medium); br-glyph-mono.png was
      rendered through Chromium honoring weight 800. This svg is the editable,
      browser-faithful source-of-truth; do NOT feed it to sips.
    ============================================================================
    Geometry matches the app icon exactly (studio dials size 70 / offset -20 /
    gap 2; docs/design/logo-icon-studio.html). Same union center, cap height,
    and split-underline seam as br-icon-beige.png - only the colours differ.
  -->
  <g transform="translate(106.12 307.75)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif"
     font-weight="800" fill="#000000">
    <text x="0" y="0" font-size="258.7606895444359">B</text>
    <text x="174.55491638183594" y="0" font-size="191.48291026288254">R</text>
    <rect x="0" y="60.84809692382812" width="171.55491638183594" height="45.72485504150391"/>
    <rect x="171.55491638183594" y="60.84809692382812" width="128.20230865478516" height="45.72485504150391"/>
  </g>
</svg>
