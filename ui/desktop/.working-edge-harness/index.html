<!doctype html>
<html lang="en" data-theme="parchment">
  <head>
    <meta charset="utf-8" />
    <title>Composer working edge — probes</title>
    <link rel="stylesheet" href="./harness.css" />
    <style>
      /* Harness chrome only. Nothing here touches the probes themselves — they
         are the app's real classes against the app's real main.css. */
      body {
        margin: 0;
        padding: 24px;
        background: var(--background-canvas);
        color: var(--text-default);
        font-family: var(--font-sans);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        max-width: 1100px;
      }
      .probe > h2 {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="probe">
        <h2>idle · unfocused</h2>
        <div
          id="idle"
          class="biorouter-composer-card relative flex min-w-0 flex-col rounded-container border border-border-subtle/60 bg-background-default py-2.5 pr-3 pl-4"
        >
          <div class="flex items-end gap-2.5">
            <textarea
              id="ta-idle"
              rows="1"
              placeholder="⌘↑/⌘↓ to navigate messages"
              class="text-body block w-full resize-none border-none bg-transparent px-0 py-1.5 text-text-default placeholder:text-text-muted"
            ></textarea>
            <span class="h-8 w-8 flex-shrink-0 rounded-element bg-background-medium"></span>
          </div>
        </div>
      </div>

      <div class="probe">
        <h2>idle · focused &mdash; the D-15 edge</h2>
        <div
          id="idle-focus"
          class="biorouter-composer-card relative flex min-w-0 flex-col rounded-container border border-border-subtle/60 bg-background-default py-2.5 pr-3 pl-4"
        >
          <div class="flex items-end gap-2.5">
            <textarea
              id="ta-idle-focus"
              rows="1"
              placeholder="⌘↑/⌘↓ to navigate messages"
              class="text-body block w-full resize-none border-none bg-transparent px-0 py-1.5 text-text-default placeholder:text-text-muted"
            ></textarea>
            <span class="h-8 w-8 flex-shrink-0 rounded-element bg-background-medium"></span>
          </div>
        </div>
      </div>

      <div class="probe">
        <h2>working · unfocused</h2>
        <div
          id="working"
          data-working="true"
          class="biorouter-composer-card relative flex min-w-0 flex-col rounded-container border border-border-subtle/60 bg-background-default py-2.5 pr-3 pl-4"
        >
          <div class="flex items-end gap-2.5">
            <textarea
              id="ta-working"
              rows="1"
              placeholder="⌘↑/⌘↓ to navigate messages"
              class="text-body block w-full resize-none border-none bg-transparent px-0 py-1.5 text-text-default placeholder:text-text-muted"
            ></textarea>
            <span class="h-8 w-8 flex-shrink-0 rounded-element bg-background-accent"></span>
          </div>
        </div>
      </div>

      <div class="probe">
        <h2>working · focused &mdash; the case that must not collapse</h2>
        <div
          id="working-focus"
          data-working="true"
          class="biorouter-composer-card relative flex min-w-0 flex-col rounded-container border border-border-subtle/60 bg-background-default py-2.5 pr-3 pl-4"
        >
          <div class="flex items-end gap-2.5">
            <textarea
              id="ta-working-focus"
              rows="1"
              placeholder="⌘↑/⌘↓ to navigate messages"
              class="text-body block w-full resize-none border-none bg-transparent px-0 py-1.5 text-text-default placeholder:text-text-muted"
            ></textarea>
            <span class="h-8 w-8 flex-shrink-0 rounded-element bg-background-accent"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
