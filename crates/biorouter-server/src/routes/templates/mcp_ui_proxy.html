<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="referrer" content="no-referrer"/>
    <meta 
      http-equiv="Content-Security-Policy" 
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"/>
    <title>MCP-UI Proxy</title>
    <style>
      body,
      html {
        margin: 0;
        height: 100vh;
        width: 100vw;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      * {
        box-sizing: border-box;
      }
      iframe {
        background-color: transparent;
        border: 0 none transparent;
        padding: 0;
        overflow: hidden;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const contentType = params.get('contentType');

      if (contentType === 'rawhtml') {
        // Double-iframe raw HTML mode (HTML sent via postMessage)
        const inner = document.createElement('iframe');
        inner.name = 'biorouter-artifact-preview';
        inner.style = 'width:100%; height:100%; border:none;';
        inner.setAttribute('sandbox', 'allow-scripts allow-downloads');
        document
          .body
          .appendChild(inner);

        // Wait for HTML content from parent
        window.addEventListener('message', (event) => {
          if (event.source === window.parent) {
            if (event.data && event.data.type === 'ui-html-content') {
              const payload = event.data.payload || {};
              const html = payload.html;
              if (typeof html === 'string') {
                inner.srcdoc = html;
              }
            } else {
              if (inner && inner.contentWindow) {
                inner
                  .contentWindow
                  .postMessage(event.data, '*');
              }
            }
          } else if (event.source === inner.contentWindow) {
            // Relay messages from inner to parent
            window
              .parent
              .postMessage(event.data, '*');
          }
        });

        // Notify parent that proxy is ready to receive HTML (distinct event)
        window
          .parent
          .postMessage({
            type: 'ui-proxy-iframe-ready'
          }, '*');
      } else {
        document.body.textContent = 'Error: unsupported proxy mode';
      }
    </script>
  </body>
</html>
