<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Plot</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.tooltip{position:absolute;opacity:0;pointer-events:none;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Forest Plot</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="chart" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
        </div>
    </div>
    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const forestData = {{FOREST_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            if (forestData.title) document.getElementById('title').textContent = forestData.title;

            const rows = forestData.rows;
            const logScale = !!forestData.logScale;
            const refLine = (typeof forestData.referenceLine === 'number') ? forestData.referenceLine : (logScale ? 1 : 0);

            const margin = { top: 24, right: 220, bottom: 72, left: 240 };
            const rowH = 32;
            const innerW = 520;
            const innerH = rows.length * rowH;
            const svg = d3.select('#chart').attr('width', margin.left + innerW + margin.right).attr('height', margin.top + innerH + margin.bottom);
            const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

            const lo = d3.min(rows, function (r) { return r.lower; });
            const hi = d3.max(rows, function (r) { return r.upper; });
            let x;
            if (logScale) {
                x = d3.scaleLog().domain([Math.max(1e-6, lo * 0.9), hi * 1.1]).range([0, innerW]);
            } else {
                const pad = (hi - lo) * 0.1 || 1;
                x = d3.scaleLinear().domain([lo - pad, hi + pad]).range([0, innerW]);
            }
            function markerWeight(row) {
                const weight = row.weight == null ? 1 : row.weight;
                if (!Number.isFinite(weight) || weight < 0) throw new Error('Forest weights must be finite and non-negative.');
                return weight;
            }
            const maxW = d3.max(rows, markerWeight) || 1;

            g.append('g').attr('transform', 'translate(0,' + innerH + ')').call(d3.axisBottom(x).ticks(6, '~g'));
            if (forestData.xAxisLabel) {
                g.append('text').attr('x', innerW / 2).attr('y', innerH + 52).attr('text-anchor', 'middle')
                    .each(function () { BioRouterViz.fitSvgLabel(this, forestData.xAxisLabel, innerW); });
            }
            // Reference line.
            if (refLine >= x.domain()[0] && refLine <= x.domain()[1]) {
                g.append('line').attr('x1', x(refLine)).attr('x2', x(refLine)).attr('y1', 0).attr('y2', innerH)
                    .attr('stroke', BioRouterViz.colors.muted).attr('stroke-dasharray', '5,4');
            }

            rows.forEach(function (r, i) {
                const cy = i * rowH + rowH / 2;
                g.append('text').attr('x', -margin.left + 4).attr('y', cy + 4)
                    .each(function () { BioRouterViz.fitSvgLabel(this, r.label, margin.left - 20); });
                g.append('line').attr('x1', x(r.lower)).attr('x2', x(r.upper)).attr('y1', cy).attr('y2', cy)
                    .attr('stroke', BioRouterViz.colors.text).attr('stroke-width', 1.5);
                [r.lower, r.upper].forEach(function (b) {
                    g.append('line').attr('x1', x(b)).attr('x2', x(b)).attr('y1', cy - 4).attr('y2', cy + 4).attr('stroke', BioRouterViz.colors.text);
                });
                const sz = 5 + 8 * Math.sqrt(markerWeight(r) / maxW);
                g.append('rect').attr('x', x(r.estimate) - sz / 2).attr('y', cy - sz / 2).attr('width', sz).attr('height', sz)
                    .attr('fill', BioRouterViz.palette[0]);
                g.append('text').attr('x', innerW + 8).attr('y', cy + 4)
                    .each(function () { BioRouterViz.fitSvgLabel(this, r.estimate + ' (' + r.lower + '–' + r.upper + ')', margin.right - 16); });
            });
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Study / variable', 'Estimate', 'Lower CI', 'Upper CI', 'Weight'],
                rows.map((row) => [row.label, row.estimate, row.lower, row.upper, row.weight]),
                (forestData.xAxisLabel || 'Effect estimate') + '. ' + (logScale ? 'Logarithmic' : 'Linear') + ' axis; reference value ' + refLine + '. Omitted weights default to 1; zero weights retain a minimum visible marker.');
            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
