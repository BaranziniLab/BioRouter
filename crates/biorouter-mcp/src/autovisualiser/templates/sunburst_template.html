<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunburst</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.tooltip{position:absolute;opacity:0;pointer-events:none;}#chart{display:block;}#chart text{pointer-events:none;}#layoutNote{overflow-wrap:anywhere;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Sunburst</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="chart" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
            <p class="figure-description" id="layoutNote"></p>
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <details class="figure-data"><summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const sunburstData = {{SUNBURST_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            document.getElementById('title').textContent = sunburstData.name || 'Sunburst';

            const size = 700, radius = size / 2;
            const svg = d3.select('#chart').attr('width', size).attr('height', size)
                .append('g').attr('transform', 'translate(' + radius + ',' + radius + ')');
            const tooltip = d3.select('#tooltip');

            const root = d3.hierarchy(sunburstData)
                .sum(function (d) {
                    if (d.value != null && (!Number.isFinite(d.value) || d.value < 0)) throw new Error('Sunburst values must be finite and non-negative.');
                    return d.value || 0;
                })
                .sort(function (a, b) { return b.value - a.value; });
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Node', 'Hierarchy path', 'Category', 'Own value', 'Aggregate value'],
                root.descendants().map(function (node) { return [node.data.name, node.ancestors().reverse().map(function (parent) { return parent.data.name; }).join(' / '), node.data.category, node.data.value, node.value]; }),
                'Aggregate values add each node’s own supplied value and all descendant values. Internal own values are not assigned to child sectors.');
            if (!root.value || !root.children) {
                document.getElementById('chart').style.display = 'none';
                const hasValues = root.descendants().some(function (node) { return node.data.value != null; });
                document.getElementById('layoutNote').textContent = !hasValues ? 'No values supplied; no sectors to compare.' : !root.value ? 'All values are zero; no sectors to compare.' : 'A single root has no child sectors; its value is shown in the table.';
                BioRouterViz.reportSize();
                return;
            }
            d3.partition().size([2 * Math.PI, radius])(root);

            const arc = d3.arc()
                .startAngle(function (d) { return d.x0; }).endAngle(function (d) { return d.x1; })
                .innerRadius(function (d) { return d.y0; }).outerRadius(function (d) { return d.y1 - 1; });

            const palette = BioRouterViz.palette;
            function topColor(d) { let n = d; while (n.depth > 1) n = n.parent; return n; }
            const tops = root.children || [];

            svg.selectAll('path').data(root.descendants().filter(function (d) { return d.depth; }))
                .join('path')
                .attr('d', arc)
                .attr('fill', function (d) {
                    const key = topColor(d);
                    const idx = tops.indexOf(key);
                    const base = palette[(idx < 0 ? 0 : idx) % palette.length];
                    return base;
                })
                .attr('fill-opacity', 1)
                .attr('stroke', BioRouterViz.colors.surface)
                .on('mouseover', function (event, d) {
                    const path = d.ancestors().map(function (n) { return n.data.name; }).reverse().join(' › ');
                    tooltip.style('opacity', 1).text(path + '\nAggregate value: ' + d.value + '\nOwn value: ' + (d.data.value == null ? 'not supplied' : d.data.value))
                        .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 10) + 'px');
                })
                .on('mouseout', function () { tooltip.style('opacity', 0); });

            svg.selectAll('text').data(root.descendants().filter(function (d) { return d.depth && (d.x1 - d.x0) * (d.y0 + d.y1) / 2 >= 20; }))
                .join('text')
                .attr('transform', function (d) {
                    const ang = (d.x0 + d.x1) / 2 * 180 / Math.PI - 90;
                    const r = (d.y0 + d.y1) / 2;
                    return 'rotate(' + ang + ') translate(' + r + ',0) rotate(' + (ang > 90 ? 180 : 0) + ')';
                })
                .attr('text-anchor', 'middle').attr('dy', 4).style('font-size', '14px').style('fill', BioRouterViz.dark ? '#171713' : '#fff')
                .each(function (d) { BioRouterViz.fitSvgLabel(this, d.data.name, Math.max(0, d.y1 - d.y0 - 16)); });

            BioRouterViz.hideOverlappingSvgLabels(document.getElementById('chart'), 'text');
            document.getElementById('layoutNote').textContent = 'Colors distinguish top-level branches. Labels are shown where they fit. Full hierarchy paths appear in the bounded data table; its caption states any row limit.';

            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
