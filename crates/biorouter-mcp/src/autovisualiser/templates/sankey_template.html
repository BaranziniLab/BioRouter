<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankey Diagram</title>

    {{ASSETS}}
    <script>{{COMMON}}</script>
    

    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(12px, 2.5vw, 28px); background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1200px; min-width: 0; margin: 0 auto; }
        h1, .chart-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
        .figure-subtitle { margin: -6px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
        .figure-scroll { max-width: 100%; overflow: auto; }
        svg { display: block; }
        .tooltip { position: absolute; white-space: pre-line; opacity: 0; pointer-events: none; }
        .figure-data { max-width: 1200px; margin: 16px auto 0; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; overflow-wrap: anywhere; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; overflow-wrap: normal; }
        td { font-variant-numeric: tabular-nums; }
        .numeric { white-space: nowrap; }
        button { color: inherit; font: inherit; }
        button:focus-visible, summary:focus-visible, .figure-scroll:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .stats-panel { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
        .stat-card, .stat-item { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-title, .stat-label { font-size: 12px; }
        .chart-legend, .legend-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
        .legend-panel { margin-top: 14px; }
        .legend-title { font-weight: 500; }
        .legend-item { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; }
        .legend-label { min-width: 0; overflow-wrap: anywhere; }
        .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }
        .legend-color { width: 14px; height: 3px; flex: 0 0 14px; align-self: center; }
        .legend-item[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .node rect { cursor: pointer; stroke: var(--bg); stroke-width: 1px; }
        .node text { fill: var(--text); font-size: 14px; pointer-events: none; }
        .link { fill: none; stroke-opacity: 0.4; cursor: pointer; }
        .link:hover { stroke-opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flow between stages</h1>
        <div class="figure-scroll" tabindex="0" aria-label="Sankey diagram"><svg id="sankey" role="img" aria-label="Flows between stages; Values follow in the data table"></svg></div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>

    <script>

        BioRouterViz.applyPageTheme();

        // Data will be injected here
        const sankeyData = {{SANKEY_DATA}};

        // Sankey variables
        let svg, sankey, tooltip;
        const width = 500;
        const height = 400;
        const margin = { top: 20, right: 20, bottom: 20, left: 20 };

        // Color schemes for different categories
        const colorScale = d3.scaleOrdinal(BioRouterViz.palette);

        // Initialize SVG
        function initializeSVG() {
            svg = d3.select("#sankey")
                .attr("width", width)
                .attr("height", height);
            
            svg.selectAll("*").remove();
            
            sankey = d3.sankey()
                .nodeWidth(20)
                .nodePadding(10)
                .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);
            
            tooltip = d3.select("#tooltip");
        }

        // Draw the Sankey diagram
        function drawSankey(data) {
            // Create a map of node names to indices
            const nodeMap = new Map();
            data.nodes.forEach((node, index) => {
                nodeMap.set(node.name, index);
            });

            // Process data for D3 Sankey - convert node names to indices in links
            const processedLinks = data.links.map(link => ({
                source: nodeMap.get(link.source),
                target: nodeMap.get(link.target),
                value: link.value
            }));

            const graph = sankey({
                nodes: data.nodes.map(d => ({ ...d })),
                links: processedLinks
            });

            // Draw links
            svg.append("g")
                .selectAll("path")
                .data(graph.links)
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.sankeyLinkHorizontal())
                .attr("stroke", d => {
                    const sourceCategory = d.source.category;
                    return colorScale(sourceCategory || d.source.name);
                })
                .attr("stroke-width", d => Math.max(1, d.width))
                .on("mouseover", function(event, d) {
                    showLinkTooltip(event, d);
                })
                .on("mouseout", hideTooltip);

            // Draw nodes
            const node = svg.append("g")
                .selectAll("g")
                .data(graph.nodes)
                .enter().append("g")
                .attr("class", "node");

            node.append("rect")
                .attr("x", d => d.x0)
                .attr("y", d => d.y0)
                .attr("height", d => d.y1 - d.y0)
                .attr("width", d => d.x1 - d.x0)
                .attr("fill", d => colorScale(d.category || d.name))
                .on("mouseover", function(event, d) {
                    showNodeTooltip(event, d);
                })
                .on("mouseout", hideTooltip);

            // Add node labels
            node.append("text")
                .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
                .attr("y", d => (d.y1 + d.y0) / 2)
                .attr("dy", "0.35em")
                .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end")
                .text(d => d.name)
                .each(function(d) {
                    BioRouterViz.fitSvgLabel(this, d.name, width / 3 - 20);
                    if (d.y1 - d.y0 < 18) this.textContent = '';
                })
                .style("fill", BioRouterViz.colors.text);
        }

        // Tooltip functions
        function showNodeTooltip(event, d) {
            const totalIn = d.targetLinks.reduce((sum, link) => sum + link.value, 0);
            const totalOut = d.sourceLinks.reduce((sum, link) => sum + link.value, 0);
            
            tooltip.style("opacity", 1)
                .text(d.name + '\nCategory: ' + (d.category || '—') +
                    '\nTotal in: ' + totalIn.toLocaleString() + '\nTotal out: ' + totalOut.toLocaleString())
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }

        function showLinkTooltip(event, d) {
            tooltip.style("opacity", 1)
                .text(d.source.name + ' → ' + d.target.name + '\nFlow: ' + d.value.toLocaleString())
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }

        function hideTooltip() {
            tooltip.style("opacity", 0);
        }

        // Function to measure and report content size for iframe auto-resizing
        function reportContentSize() {
            // Get the actual content height
            const contentHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            
            // Send size change message to parent window (for MCP-UI iframe auto-resize)
            // The message format must match what the MCP-UI client expects
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'ui-size-change',  // lowercase as expected by MCP-UI client
                    payload: {
                        height: contentHeight
                        // width is optional, we're not setting it to allow responsive design
                    }
                }, '*');
            }
        }

        // Initialize and render on load
        window.onload = function() {
            initializeSVG();
            drawSankey(sankeyData);
            BioRouterViz.hideOverlappingSvgLabels(svg.node(), '.node text');
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Source', 'Target', 'Flow'], sankeyData.links.map((link) =>
                [link.source, link.target, link.value]), 'flow values.');
            BioRouterViz.autoResize();
            
            // Report initial size
            setTimeout(reportContentSize, 100);
            
            // Watch for size changes using ResizeObserver if available
            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    reportContentSize();
                });
                resizeObserver.observe(document.body);
                resizeObserver.observe(document.documentElement);
            }
            
            // Fallback: also report on window resize
            window.addEventListener('resize', reportContentSize);
        };
    </script>
</body>
</html>
