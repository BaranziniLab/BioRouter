<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: clamp(12px, 2.5vw, 28px); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.4; }
        .container { max-width: 1200px; margin: 0 auto; min-width: 0; }
        .header { padding: 0 0 16px; text-align: left; }
        .header h1 { margin: 0; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
        .header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
        .chart-container { position: relative; height: 420px; min-width: 0; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 12px; padding: 0; list-style: none; }
        .chart-legend[hidden] { display: none; }
        .chart-legend li { min-width: 0; max-width: 100%; }
        .chart-legend button { display: flex; align-items: baseline; gap: 8px; border: 0; padding: 2px 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
        .chart-legend button[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .chart-legend button:focus-visible, summary:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .swatch { width: 18px; height: 3px; flex: 0 0 18px; align-self: center; }
        details { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; }
        td { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <main class="container viz-root">
        <header class="header">
            <h1 id="chartTitle">Chart</h1>
            <p id="chartSubtitle" hidden></p>
        </header>
        <ul id="chartLegend" class="chart-legend" aria-label="Data series"></ul>
        <div class="chart-container">
            <canvas id="mainChart" role="img" aria-labelledby="chartTitle" aria-describedby="chartSubtitle chartTableSummary"></canvas>
        </div>
        <details>
            <summary id="chartTableSummary">View chart data</summary>
            <div class="table-scroll"><table id="chartTable"></table></div>
        </details>
    </main>
    <script>
        const chartData = {{CHART_DATA}};
        BioRouterViz.applyPageTheme();
        BioRouterViz.applyChartDefaults();
        const canvas = document.getElementById('mainChart');
        const chartHost = canvas.parentElement;
        const context = canvas.getContext('2d');
        const chartType = chartData.type || 'line';
        const categorical = chartType !== 'scatter' && !chartData.datasets.some((dataset) => dataset.data.some((value) => value && typeof value === 'object'));
        const colors = BioRouterViz.colors;
        let chart;
        let previousWidth = 0;

        function layout() {
            const width = chartHost.clientWidth;
            const size = width < 600 ? 14 : 16;
            context.font = size + 'px ' + Chart.defaults.font.family;
            const measure = (text) => {
                context.save();
                context.font = size + 'px ' + Chart.defaults.font.family;
                const measured = context.measureText(text).width;
                context.restore();
                return measured;
            };
            const tickCount = Math.max(2, Math.min((chartData.labels || []).length || 2, Math.floor((width - 80) / 100)));
            const labelWidth = Math.max(42, Math.min(180, (width - 90) / tickCount - 16));
            const wrap = (text) => BioRouterViz.wrapLabel(text, labelWidth, measure);
            const maxLines = (chartData.labels || []).reduce((max, label) => Math.max(max, wrap(label).length), 1);
            const xTitle = BioRouterViz.wrapLabel(chartData.xAxisLabel || '', Math.max(80, width - 110), measure);
            chartHost.style.height = Math.max(280, Math.min(500, width * 0.5)) + maxLines * size * 1.3 + xTitle.length * size * 1.3 + 48 + 'px';
            return { size, tickCount, wrap, xTitle };
        }

        function chartOptions(metrics) {
            return {
                responsive: true, maintainAspectRatio: false, animation: false,
                interaction: { intersect: false, mode: chartType === 'scatter' ? 'nearest' : 'index' },
                plugins: {
                    legend: { display: false }, title: { display: false },
                    tooltip: { callbacks: {
                        title: (items) => items.length ? BioRouterViz.wrapChartTooltip(items[0].label, items[0].chart) : [],
                        label: (item) => BioRouterViz.wrapChartTooltip(
                            (item.dataset.label ? item.dataset.label + ': ' : '') + item.formattedValue,
                            item.chart
                        )
                    } }
                },
                layout: { padding: { top: 8, right: 12, bottom: 0, left: 0 } },
                scales: {
                    x: {
                        type: categorical ? 'category' : 'linear',
                        grid: { display: !categorical, color: colors.grid },
                        border: { color: colors.border },
                        ticks: { color: colors.text, font: { size: metrics.size }, autoSkip: true, maxTicksLimit: categorical ? metrics.tickCount : 6, minRotation: 0, maxRotation: 0, padding: 8,
                            ...(categorical ? { callback: function (value) { return metrics.wrap(this.getLabelForValue(value)); } } : {}) },
                        title: { display: !!chartData.xAxisLabel, text: metrics.xTitle, color: colors.text, font: { size: metrics.size, weight: '500' }, padding: { top: 12, bottom: 0 } }
                    },
                    y: {
                        beginAtZero: chartType === 'bar',
                        grid: { color: colors.grid }, border: { display: false },
                        ticks: { color: colors.text, font: { size: metrics.size }, padding: 8, maxTicksLimit: 7 },
                        title: { display: !!chartData.yAxisLabel, text: BioRouterViz.wrapLabel(chartData.yAxisLabel || '', 260, (text) => context.measureText(text).width), color: colors.text, font: { size: metrics.size, weight: '500' }, padding: { top: 0, bottom: 8 } }
                    }
                }
            };
        }

        function processDatasets() {
            return chartData.datasets.map((dataset, index) => {
                const color = BioRouterViz.palette[index % BioRouterViz.palette.length];
                return {
                    ...dataset,
                    backgroundColor: dataset.backgroundColor || dataset.borderColor || color,
                    borderColor: dataset.borderColor || dataset.backgroundColor || color,
                    borderWidth: dataset.borderWidth === undefined ? (chartType === 'bar' ? 0 : 2) : dataset.borderWidth,
                    tension: dataset.tension === undefined ? 0 : dataset.tension,
                    fill: dataset.fill === undefined ? false : dataset.fill,
                    pointRadius: chartType === 'scatter' ? 4 : 3,
                    pointStyle: ['circle', 'rect', 'triangle', 'crossRot'][index % 4],
                    borderDash: chartType === 'line' && index % 2 ? [6, 3] : []
                };
            });
        }

        function renderLegend(datasets) {
            const legend = document.getElementById('chartLegend');
            if (datasets.length < 2) { legend.hidden = true; return; }
            datasets.forEach((dataset, index) => {
                const item = document.createElement('li');
                const button = document.createElement('button');
                button.type = 'button';
                button.setAttribute('aria-pressed', 'true');
                const swatch = document.createElement('span');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = dataset.borderColor;
                swatch.setAttribute('aria-hidden', 'true');
                const label = document.createElement('span');
                label.textContent = dataset.label || 'Series ' + (index + 1);
                button.append(swatch, label);
                button.addEventListener('click', () => {
                    const visible = !chart.isDatasetVisible(index);
                    chart.setDatasetVisibility(index, visible);
                    button.setAttribute('aria-pressed', String(visible));
                    chart.update();
                });
                item.appendChild(button);
                legend.appendChild(item);
            });
        }

        function renderTable() {
            const table = document.getElementById('chartTable');
            const caption = table.createCaption();
            caption.textContent = chartData.title || 'Chart data';
            const head = table.createTHead().insertRow();
            [categorical ? chartData.xAxisLabel || 'Observation' : 'Observation', ...chartData.datasets.map((ds) => ds.label || chartData.yAxisLabel || 'Value')].forEach((label) => {
                const cell = document.createElement('th'); cell.scope = 'col'; cell.textContent = label; head.appendChild(cell);
            });
            const count = chartData.datasets.reduce((max, dataset) => Math.max(max, dataset.data.length), 0);
            const xLabel = chartData.xAxisLabel || 'x';
            const yLabel = chartData.yAxisLabel || 'y';
            const body = table.createTBody();
            for (let index = 0; index < Math.min(count, 500); index++) {
                const row = body.insertRow();
                row.insertCell().textContent = (chartData.labels || [])[index] ?? String(index + 1);
                chartData.datasets.forEach((dataset) => {
                    const value = dataset.data[index];
                    row.insertCell().textContent = value && typeof value === 'object' ? xLabel + ': ' + value.x + '; ' + yLabel + ': ' + value.y : String(value ?? '—');
                });
            }
            if (count > 500) caption.textContent += ' — first 500 of ' + count + ' observations';
        }

        BioRouterViz.guard(function () {
            const title = chartData.title || (chartData.yAxisLabel && chartData.xAxisLabel ? chartData.yAxisLabel + ' by ' + chartData.xAxisLabel : chartData.datasets[0].label || 'Chart');
            document.getElementById('chartTitle').textContent = title;
            document.title = title;
            if (chartData.subtitle) {
                const subtitle = document.getElementById('chartSubtitle');
                subtitle.textContent = chartData.subtitle;
                subtitle.hidden = false;
            }
            const metrics = layout();
            previousWidth = chartHost.clientWidth;
            const datasets = processDatasets();
            renderLegend(datasets);
            renderTable();
            chart = new Chart(context, { type: chartType, data: { labels: chartData.labels || [], datasets }, options: chartOptions(metrics) });
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(() => {
                    if (chartHost.clientWidth === previousWidth) return;
                    previousWidth = chartHost.clientWidth;
                    chart.options = chartOptions(layout());
                    chart.resize();
                    chart.update('none');
                }).observe(chartHost);
            }
            BioRouterViz.autoResize();
        });
    </script>
</body>
</html>
