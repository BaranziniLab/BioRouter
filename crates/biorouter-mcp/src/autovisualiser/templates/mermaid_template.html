<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>

    {{ASSETS}}
    <script>{{COMMON}}</script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: clamp(12px, 2.5vw, 28px);
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            min-width: 0;
        }
        .header { text-align: left; margin-bottom: 16px; }
        .header h1 { margin: 0; font-size: clamp(18px, 2vw, 22px); line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
        .figure-scroll { overflow: auto; max-width: 100%; }
        #mermaidTarget { width: max-content; min-width: 100%; }
        #mermaidTarget svg { display: block; max-width: none !important; margin: 0 auto; }
        details { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px; }
        summary { cursor: pointer; font-size: 14px; color: var(--muted); }
        pre { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1>{{TITLE}}</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Diagram; scroll to view large layouts">
                <div id="mermaidTarget"></div>
            </div>
            <details><summary>View diagram source</summary><pre id="diagramSource"></pre></details>
        </div>
    </div>

    <script>
        // Mermaid source is injected as a safely-escaped JS string literal.
        const mermaidCode = {{MERMAID_CODE}};
        document.getElementById('diagramSource').textContent = mermaidCode;

        BioRouterViz.autoResize();

        // The library tag above is parser-blocking in both asset modes (an
        // inlined vendored copy offline, an inlined CDN copy after the desktop
        // rewriter), so `mermaid` is normally already defined here. Waiting
        // anyway costs one microtask and keeps this template correct for any
        // deferred delivery — and, more usefully, it separates "the library
        // never arrived" from "the diagram is invalid", which used to be
        // reported with the same message.
        function waitForMermaid(timeoutMs) {
            if (typeof mermaid !== 'undefined') return Promise.resolve(mermaid);
            return new Promise(function (resolve, reject) {
                const started = Date.now();
                const timer = setInterval(function () {
                    if (typeof mermaid !== 'undefined') {
                        clearInterval(timer);
                        resolve(mermaid);
                    } else if (Date.now() - started > timeoutMs) {
                        clearInterval(timer);
                        reject(new Error('Mermaid library failed to load.'));
                    }
                }, 25);
            });
        }

        BioRouterViz.guard(function () {
            waitForMermaid(5000).then(
                function (mermaidLib) {
                    mermaidLib.initialize({
                        startOnLoad: false,
                        securityLevel: 'strict',
                        theme: 'base',
                        themeCSS: '.grid .tick text { font-size: 14px; }',
                        themeVariables: {
                            darkMode: BioRouterViz.dark,
                            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                            fontSize: '16px',
                            background: BioRouterViz.colors.bg,
                            primaryColor: BioRouterViz.dark ? '#303b40' : '#eef2f3',
                            primaryTextColor: BioRouterViz.colors.text,
                            primaryBorderColor: BioRouterViz.palette[0],
                            lineColor: BioRouterViz.colors.muted,
                            secondaryColor: BioRouterViz.dark ? '#38372f' : '#f4f1e8',
                            tertiaryColor: BioRouterViz.dark ? '#303a34' : '#eef2ee'
                        },
                        flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'linear' },
                        sequence: { useMaxWidth: false },
                        er: { useMaxWidth: false, fontSize: 18 },
                        gantt: { useMaxWidth: false, useWidth: 1000, axisFormat: '%Y-%m-%d', fontSize: 16, sectionFontSize: 16, barHeight: 24, barGap: 8 }
                    });
                    return mermaidLib.render('biorouterMermaidSvg', mermaidCode)
                        .then(function (res) {
                            document.getElementById('mermaidTarget').innerHTML = res.svg;
                            const svg = document.getElementById('mermaidTarget').querySelector('svg');
                            const bounds = svg && svg.viewBox && svg.viewBox.baseVal;
                            if (bounds && bounds.width > 0 && bounds.height > 0) {
                                svg.style.width = bounds.width + 'px';
                                svg.style.height = bounds.height + 'px';
                                svg.setAttribute('width', bounds.width);
                                svg.setAttribute('height', bounds.height);
                            }
                            if (svg) BioRouterViz.hideOverlappingSvgLabels(svg, '.grid .tick text');
                            if (res.bindFunctions) res.bindFunctions(document.getElementById('mermaidTarget'));
                            BioRouterViz.reportSize();
                        })
                        .catch(function (err) {
                            BioRouterViz.showError(
                                'The diagram syntax could not be rendered.',
                                (err && err.message) ? err.message : err
                            );
                        });
                },
                function (err) {
                    BioRouterViz.showError(
                        'The Mermaid library could not be loaded.',
                        (err && err.message) ? err.message : err
                    );
                }
            ).catch(function (err) {
                BioRouterViz.showError('The diagram could not be initialized.', (err && err.message) ? err.message : err);
            });
        });
    </script>
</body>
</html>
