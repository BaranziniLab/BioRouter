<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>

    {{ASSETS}}
    <script>{{COMMON}}</script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: auto;
            padding: 30px;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0; font-size: 1.6em; font-weight: 300; color: var(--text); }
        #mermaidTarget { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        #mermaidTarget svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1>{{TITLE}}</h1></div>
            <div id="mermaidTarget" class="mermaid"></div>
        </div>
    </div>

    <script>
        // Mermaid source is injected as a safely-escaped JS string literal.
        const mermaidCode = {{MERMAID_CODE}};

        BioRouterViz.autoResize();

        // The library tag above is parser-blocking in both asset modes (an
        // inlined vendored copy offline, an inlined CDN copy after the desktop
        // rewriter), so `mermaid` is normally already defined here. Waiting
        // anyway costs one microtask and keeps this template correct for any
        // deferred delivery — and, more usefully, it separates "the library
        // never arrived" from "the diagram is invalid", which used to be
        // reported with the same message.
        function waitForMermaid(timeoutMs) {
            if (typeof mermaid !== 'undefined') return Promise.resolve(mermaid);
            return new Promise(function (resolve, reject) {
                const started = Date.now();
                const timer = setInterval(function () {
                    if (typeof mermaid !== 'undefined') {
                        clearInterval(timer);
                        resolve(mermaid);
                    } else if (Date.now() - started > timeoutMs) {
                        clearInterval(timer);
                        reject(new Error('Mermaid library failed to load.'));
                    }
                }, 25);
            });
        }

        BioRouterViz.guard(function () {
            waitForMermaid(5000).then(
                function (mermaidLib) {
                    mermaidLib.initialize({
                        startOnLoad: false,
                        securityLevel: 'strict',
                        theme: BioRouterViz.dark ? 'dark' : 'default',
                        flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
                        sequence: { useMaxWidth: true },
                        gantt: { useMaxWidth: true, axisFormat: '%Y-%m-%d' }
                    });
                    return mermaidLib.render('biorouterMermaidSvg', mermaidCode)
                        .then(function (res) {
                            document.getElementById('mermaidTarget').innerHTML = res.svg;
                            if (res.bindFunctions) res.bindFunctions(document.getElementById('mermaidTarget'));
                            BioRouterViz.reportSize();
                        })
                        .catch(function (err) {
                            BioRouterViz.showError(
                                'The diagram syntax could not be rendered.',
                                (err && err.message) ? err.message : err
                            );
                        });
                },
                function (err) {
                    BioRouterViz.showError(
                        'The Mermaid library could not be loaded.',
                        (err && err.message) ? err.message : err
                    );
                }
            );
        });
    </script>
</body>
</html>
