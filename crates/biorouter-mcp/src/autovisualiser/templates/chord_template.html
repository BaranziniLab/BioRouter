<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Diagram</title>
    
    {{ASSETS}}
    <script>{{COMMON}}</script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(12px, 2.5vw, 28px); background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1200px; min-width: 0; margin: 0 auto; }
        h1, .chart-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
        .figure-subtitle { margin: -6px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
        .figure-scroll { max-width: 100%; overflow: auto; }
        svg { display: block; }
        .tooltip { position: absolute; white-space: pre-line; opacity: 0; pointer-events: none; }
        .figure-data { max-width: 1200px; margin: 16px auto 0; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; overflow-wrap: anywhere; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; overflow-wrap: normal; }
        td { font-variant-numeric: tabular-nums; }
        .numeric { white-space: nowrap; }
        button { color: inherit; font: inherit; }
        button:focus-visible, summary:focus-visible, .figure-scroll:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .stats-panel { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
        .stat-card, .stat-item { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-title, .stat-label { font-size: 12px; }
        .chart-legend, .legend-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
        .legend-panel { margin-top: 14px; }
        .legend-title { font-weight: 500; }
        .legend-item { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; }
        .legend-label { min-width: 0; overflow-wrap: anywhere; }
        .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }
        .legend-color { width: 14px; height: 3px; flex: 0 0 14px; align-self: center; }
        .legend-item[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .group-arc, .chord { cursor: pointer; }
        .chord { fill-opacity: 0.6; stroke: var(--bg); stroke-width: 0.5px; }
        .group-label { fill: var(--text); font-size: 14px; font-weight: 500; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flows between groups</h1>
        <div class="figure-scroll" tabindex="0" aria-label="Chord diagram"><svg id="chord" role="img" aria-label="Group flows; Values follow in the data table"></svg></div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>

    <script>

        BioRouterViz.applyPageTheme();

        // Data will be injected here
        const chordData = {{CHORD_DATA}};

        // Chord variables
        let svg, chord, arc, ribbon, tooltip;
        const width = 500;
        const height = 500;
        const outerRadius = Math.min(width, height) * 0.4;
        const innerRadius = outerRadius - 25;

        // Color scale
        const colors = d3.scaleOrdinal(BioRouterViz.palette);

        // Initialize SVG
        function initializeSVG() {
            svg = d3.select("#chord")
                .attr("width", width)
                .attr("height", height);
            
            svg.selectAll("*").remove();
            
            const g = svg.append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);
            
            chord = d3.chord()
                .padAngle(0.05)
                .sortSubgroups(d3.descending);
            
            arc = d3.arc()
                .innerRadius(innerRadius)
                .outerRadius(outerRadius);
            
            ribbon = d3.ribbon()
                .radius(innerRadius);
            
            tooltip = d3.select("#tooltip");
            
            return g;
        }

        // Draw the Chord diagram
        function drawChord(g, data) {
            const chords = chord(data.matrix);
            
            // Draw the groups (arcs around the circle)
            const group = g.append("g")
                .selectAll("g")
                .data(chords.groups)
                .enter().append("g")
                .attr("class", "group");

            group.append("path")
                .attr("class", "group-arc")
                .style("fill", d => colors(d.index))
                .style("stroke", d => d3.rgb(colors(d.index)).darker())
                .attr("d", arc)
                .on("mouseover", function(event, d) {
                    fadeChords(d.index, 0.1);
                    showGroupTooltip(event, d, data.labels);
                })
                .on("mouseout", function() {
                    fadeChords(null, 1);
                    hideTooltip();
                });

            // Add group labels
            group.append("text")
                .attr("class", "group-label")
                .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
                .attr("dy", ".35em")
                .attr("transform", d => `
                    rotate(${(d.angle * 180 / Math.PI - 90)})
                    translate(${outerRadius + 10})
                    ${d.angle > Math.PI ? "rotate(180)" : ""}
                `)
                .style("text-anchor", d => d.angle > Math.PI ? "end" : null)
                .text(d => data.labels[d.index])
                .each(function(d) {
                    BioRouterViz.fitSvgLabel(this, (d.index + 1) + '. ' + data.labels[d.index], width / 2 - outerRadius - 18);
                    if ((d.endAngle - d.startAngle) * outerRadius < 18) this.textContent = '';
                });

            // Draw the chords (ribbons between groups)
            g.append("g")
                .selectAll("path")
                .data(chords)
                .enter().append("path")
                .attr("class", "chord")
                .style("fill", d => colors(d.source.index))
                .attr("d", ribbon)
                .on("mouseover", function(event, d) {
                    d3.select(this).style("fill-opacity", 0.9);
                    showChordTooltip(event, d, data.labels, data.matrix);
                })
                .on("mouseout", function(event, d) {
                    d3.select(this).style("fill-opacity", 0.67);
                    hideTooltip();
                });
        }

        // Fade chords for highlighting
        function fadeChords(focusIndex, opacity) {
            svg.selectAll(".chord")
                .style("opacity", d => {
                    if (focusIndex === null) return 1;
                    return d.source.index === focusIndex || d.target.index === focusIndex ? 1 : opacity;
                });
            
            svg.selectAll(".group-arc")
                .style("opacity", d => {
                    if (focusIndex === null) return 1;
                    return d.index === focusIndex ? 1 : opacity;
                });
        }

        // Tooltip functions
        function showGroupTooltip(event, d, labels) {
            const totalOut = d.value;
            const groupName = labels[d.index];
            
            tooltip.style("opacity", 1)
                .text(groupName + '\nTotal flow: ' + totalOut.toLocaleString() + '\nGroup: ' + (d.index + 1))
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }

        function showChordTooltip(event, d, labels, matrix) {
            const sourceName = labels[d.source.index];
            const targetName = labels[d.target.index];
            const sourceToTarget = matrix[d.source.index][d.target.index];
            const targetToSource = matrix[d.target.index][d.source.index];
            
            tooltip.style("opacity", 1)
                .text(sourceName + ' → ' + targetName + ': ' + sourceToTarget.toLocaleString() +
                    '\n' + targetName + ' → ' + sourceName + ': ' + targetToSource.toLocaleString())
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }

        function hideTooltip() {
            tooltip.style("opacity", 0);
        }

        // Function to measure and report content size for iframe auto-resizing
        function reportContentSize() {
            // Get the actual content height
            const contentHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            
            // Send size change message to parent window (for MCP-UI iframe auto-resize)
            // The message format must match what the MCP-UI client expects
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'ui-size-change',  // lowercase as expected by MCP-UI client
                    payload: {
                        height: contentHeight
                        // width is optional, we're not setting it to allow responsive design
                    }
                }, '*');
            }
        }

        // Initialize and render on load
        window.onload = function() {
            const g = initializeSVG();
            drawChord(g, chordData);
            BioRouterViz.hideOverlappingSvgLabels(svg.node(), '.group-label');
            function* flowRows() {
                for (let source = 0; source < chordData.matrix.length; source++) {
                    for (let target = 0; target < chordData.matrix[source].length; target++) {
                        yield [source + 1, chordData.labels[source], chordData.labels[target], chordData.matrix[source][target]];
                    }
                }
            }
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Group', 'Source', 'Target', 'Flow'], flowRows(),
                'Directional flows; numbered groups match the diagram.', chordData.labels.length ** 2);
            BioRouterViz.autoResize();
            
            // Report initial size
            setTimeout(reportContentSize, 100);
            
            // Watch for size changes using ResizeObserver if available
            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    reportContentSize();
                });
                resizeObserver.observe(document.body);
                resizeObserver.observe(document.documentElement);
            }
            
            // Fallback: also report on window resize
            window.addEventListener('resize', reportContentSize);
        };
    </script>
</body>
</html>
