<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Graph</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.node-label{pointer-events:none;}.tooltip{position:absolute;opacity:0;pointer-events:none;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Network Graph</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="graph" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const networkData = {{NETWORK_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            if (networkData.title) document.getElementById('title').textContent = networkData.title;

            const svgEl = document.getElementById('graph');
            let width = Math.max(720, svgEl.parentElement.clientWidth);
            const height = 560;
            const svg = d3.select('#graph').attr('width', width).attr('height', height);
            const tooltip = d3.select('#tooltip');

            const groups = Array.from(new Set(networkData.nodes.map(function (n) { return n.group || 'default'; })));
            const color = function (g) { return BioRouterViz.palette[groups.indexOf(g) % BioRouterViz.palette.length]; };

            const nodes = networkData.nodes.map(function (n) { return Object.assign({}, n); });
            const links = networkData.links.map(function (l) { return Object.assign({}, l); });
            const maxVal = d3.max(nodes, function (n) { return n.value || 1; }) || 1;
            const radius = function (n) { return 6 + 14 * Math.sqrt((n.value || 1) / maxVal); };

            if (networkData.directed) {
                svg.append('defs').append('marker')
                    .attr('id', 'arrow').attr('viewBox', '0 -5 10 10').attr('refX', 10).attr('refY', 0)
                    .attr('markerUnits', 'userSpaceOnUse').attr('markerWidth', 8).attr('markerHeight', 8).attr('orient', 'auto')
                    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', BioRouterViz.colors.muted);
            }

            const link = svg.append('g').attr('stroke', BioRouterViz.colors.muted).attr('stroke-opacity', 0.5)
                .selectAll('line').data(links).join('line')
                .attr('stroke-width', function (d) { return Math.max(1, Math.sqrt(d.value || 1)); })
                .attr('marker-end', networkData.directed ? 'url(#arrow)' : null);

            const node = svg.append('g').selectAll('circle').data(nodes).join('circle')
                .attr('r', radius)
                .attr('fill', function (d) { return color(d.group || 'default'); })
                .attr('stroke', BioRouterViz.colors.surface).attr('stroke-width', 1.5)
                .style('cursor', 'grab')
                .on('mouseover', function (event, d) {
                    tooltip.style('opacity', 1)
                        .text((d.label || d.id) + (d.group ? '\nGroup: ' + d.group : '') + (d.value != null ? '\nValue: ' + d.value : ''))
                        .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 10) + 'px');
                })
                .on('mouseout', function () { tooltip.style('opacity', 0); });

            const label = svg.append('g').selectAll('text').data(nodes).join('text')
                .attr('class', 'node-label').attr('dx', function (d) { return radius(d) + 3; }).attr('dy', 4)
                .each(function (d, index) {
                    BioRouterViz.fitSvgLabel(this, index < 40 ? d.label || d.id : '', 140);
                    d.displayLabel = this.textContent;
                });

            const sim = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(function (d) { return d.id; }).distance(70))
                .force('charge', d3.forceManyBody().strength(-220))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collide', d3.forceCollide().radius(function (d) { return radius(d) + 4; }))
                .on('tick', function () {
                    nodes.forEach(function (d) {
                        const padding = radius(d) + 8;
                        d.x = Math.max(padding, Math.min(width - padding, d.x));
                        d.y = Math.max(padding, Math.min(height - padding, d.y));
                    });
                    link.each(function (d) {
                        const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                        const distance = Math.hypot(dx, dy) || 1;
                        const inset = networkData.directed ? radius(d.target) + 3 : 0;
                        d3.select(this).attr('x1', d.source.x).attr('y1', d.source.y)
                            .attr('x2', d.target.x - dx / distance * inset).attr('y2', d.target.y - dy / distance * inset);
                    });
                    node.attr('cx', function (d) { return d.x; }).attr('cy', function (d) { return d.y; });
                    label.attr('x', function (d) { return d.x; }).attr('y', function (d) { return d.y; })
                        .text(function (d) { return d.displayLabel; })
                        .each(function (d) {
                            if (!this.textContent) return;
                            const box = this.getBBox();
                            if (nodes.some((other) => other !== d && box.x < other.x + radius(other) && box.x + box.width > other.x - radius(other) && box.y < other.y + radius(other) && box.y + box.height > other.y - radius(other))) this.textContent = '';
                        });
                    BioRouterViz.hideOverlappingSvgLabels(svg.node(), '.node-label');
                });

            node.call(d3.drag()
                .on('start', function (event, d) { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', function (event, d) { d.fx = event.x; d.fy = event.y; })
                .on('end', function (event, d) { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

            window.addEventListener('resize', function () {
                const nextWidth = Math.max(720, svgEl.parentElement.clientWidth);
                if (nextWidth === width) return;
                width = nextWidth; svg.attr('width', width);
                sim.force('center', d3.forceCenter(width / 2, height / 2)).alpha(0.2).restart();
            });
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Record', 'Label', 'Node / source ID', 'Target ID', 'Group', 'Value'], [
                ...networkData.nodes.map((node) => ['Node', node.label || node.id, node.id, '', node.group, node.value]),
                ...networkData.links.map((link) => ['Edge', link.label, link.source, link.target, '', link.value])
            ], 'Node and edge records. Up to 40 labels are shown where space permits; all displayed records retain their full labels.');

            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
