<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Cloud</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.tooltip{position:absolute;opacity:0;pointer-events:none;}#chart{display:block;}#layoutNote{overflow-wrap:anywhere;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Word Cloud</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="chart" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
            <p class="figure-description" id="layoutNote"></p>
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <details class="figure-data"><summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        // Self-contained spiral word-cloud layout (no external d3-cloud dependency).
        const wordcloudData = {{WORDCLOUD_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            if (wordcloudData.title) document.getElementById('title').textContent = wordcloudData.title;

            const W = 900, H = 520;
            const svg = d3.select('#chart').attr('width', W).attr('height', H);
            const g = svg.append('g').attr('transform', 'translate(' + W / 2 + ',' + H / 2 + ')');
            const tooltip = d3.select('#tooltip');

            const words = wordcloudData.words.slice().sort(function (a, b) { return b.weight - a.weight; });
            if (words.some(function (word) { return !word.text.trim() || !Number.isFinite(word.weight) || word.weight < 0; })) throw new Error('Word cloud terms must be non-blank and weights finite and non-negative.');
            if (!words.length) throw new Error('No valid words.');
            const wmin = d3.min(words, function (w) { return w.weight; });
            const wmax = d3.max(words, function (w) { return w.weight; });
            const fs = d3.scaleSqrt().domain([wmin, wmax]).range([14, 64]);

            const ctx = document.createElement('canvas').getContext('2d');
            const fontFamily = getComputedStyle(document.getElementById('chart')).fontFamily;
            const placed = [];
            const buckets = new Map();
            const bucketSize = 64;
            function keys(box) {
                const result = [];
                for (let row = Math.floor((box.y - box.h / 2) / bucketSize); row <= Math.floor((box.y + box.h / 2) / bucketSize); row++) {
                    for (let column = Math.floor((box.x - box.w / 2) / bucketSize); column <= Math.floor((box.x + box.w / 2) / bucketSize); column++) result.push(row + ':' + column);
                }
                return result;
            }
            function collides(box) {
                for (const key of keys(box)) {
                    for (const p of buckets.get(key) || []) {
                        if (Math.abs(box.x - p.x) * 2 < (box.w + p.w) && Math.abs(box.y - p.y) * 2 < (box.h + p.h)) return true;
                    }
                }
                return false;
            }
            words.forEach(function (w, i) {
                const size = w.weight === 0 ? 14 : fs(w.weight);
                ctx.font = '600 ' + size + 'px ' + fontFamily;
                const metrics = ctx.measureText(w.text);
                const ascent = metrics.fontBoundingBoxAscent ?? size;
                const descent = metrics.fontBoundingBoxDescent ?? size * 0.25;
                const tw = metrics.width + 6;
                const th = ascent + descent + 4;
                w.placed = false;
                if (tw > W || th > H) return;
                // Archimedean spiral search for a non-overlapping spot.
                let angle = 0, x = 0, y = 0, found = false;
                for (let step = 0; step < 4000; step++) {
                    const r = 2 + 4 * angle;
                    if (r > Math.hypot(W - tw, H - th) / 2) break;
                    x = r * Math.cos(angle);
                    y = r * Math.sin(angle);
                    angle += 0.18;
                    const box = { x: x, y: y, w: tw, h: th };
                    if (Math.abs(x) + tw / 2 > W / 2 || Math.abs(y) + th / 2 > H / 2) continue;
                    if (!collides(box)) {
                        placed.push(box);
                        keys(box).forEach(function (key) { if (!buckets.has(key)) buckets.set(key, []); buckets.get(key).push(box); });
                        found = true; break;
                    }
                }
                if (!found) return;
                w.placed = true;
                g.append('text')
                    .attr('x', x).attr('y', y).attr('text-anchor', 'middle').attr('dy', (ascent - descent) / 2)
                    .style('font-size', size + 'px').style('font-weight', 600).style('font-family', fontFamily)
                    .style('fill', BioRouterViz.palette[i % BioRouterViz.palette.length])
                    .style('cursor', 'default')
                    .text(w.text)
                    .on('mouseover', function (event) {
                        tooltip.style('opacity', 1).text(w.text + '\nWeight: ' + w.weight)
                            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 10) + 'px');
                    })
                    .on('mouseout', function () { tooltip.style('opacity', 0); });
            });
            const omitted = words.length - placed.length;
            document.getElementById('layoutNote').textContent = placed.length + ' of ' + words.length + ' terms placed; ' + omitted + ' omitted from the cloud because they did not fit. Exact terms and weights remain in the bounded data table.';
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Term', 'Weight', 'Placed in cloud'],
                words.map(function (word) { return [word.text, word.weight, word.placed ? 'Yes' : 'No']; }),
                'Terms are ordered by weight. Font size is a square-root scale with a 14px minimum; zero weights remain legitimate observations.');
            if (!placed.length) document.getElementById('chart').style.display = 'none';
            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
