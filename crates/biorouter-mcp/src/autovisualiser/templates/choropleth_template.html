<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choropleth Map</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>#map{width:100%;height:560px;}.legend,.info-box{background:var(--surface);color:var(--text);padding:8px;font-size:14px;line-height:20px;max-width:min(260px,calc(100vw - 80px));overflow-wrap:anywhere;}.legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:middle;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Choropleth Map</h1></div>
            <div id="map"></div>
        </div>
    </div>
    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const choroplethData = {{CHOROPLETH_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            if (choroplethData.title) document.getElementById('title').textContent = choroplethData.title;
            if (typeof L === 'undefined') throw new Error('Leaflet failed to load.');

            const valueProp = choroplethData.valueProperty;
            const idProp = choroplethData.idProperty;
            const nameProp = choroplethData.nameProperty;
            const values = choroplethData.values || null;

            function featureValue(f) {
                const props = f.properties || {};
                let value = null;
                if (valueProp && props[valueProp] != null) value = props[valueProp];
                else if (values && idProp && props[idProp] != null && values[props[idProp]] != null) value = values[props[idProp]];
                else if (values && props.id != null && values[props.id] != null) value = values[props.id];
                if (typeof value !== 'number' && (typeof value !== 'string' || !value.trim())) return null;
                const numeric = Number(value);
                return Number.isFinite(numeric) ? numeric : null;
            }
            function featureName(f) {
                const props = f.properties || {};
                if (nameProp && props[nameProp] != null) return props[nameProp];
                return props.name ?? props.NAME ?? (idProp ? props[idProp] : '') ?? '';
            }

            const allVals = (choroplethData.geojson.features || []).map(featureValue).filter(Number.isFinite);
            if (!allVals.length) throw new Error('No numeric values found for the regions.');
            const vmin = Math.min.apply(null, allVals), vmax = Math.max.apply(null, allVals);
            const span = vmax - vmin;
            const missingColor = BioRouterViz.dark ? '#454541' : '#e4e4e0';
            function color(v) { return Number.isFinite(v) ? BioRouterViz.sequential(span ? (v - vmin) / span : 0.5) : missingColor; }

            const map = L.map('map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 18 }).addTo(map);

            const info = L.control();
            info.onAdd = function () { this._div = L.DomUtil.create('div', 'info-box'); this.update(); return this._div; };
            info.update = function (props, v) {
                this._div.textContent = props ? featureName({ properties: props }) + ': ' + (v == null ? 'No data' : v) : 'Hover or select a region';
            };
            info.addTo(map);

            const layer = L.geoJSON(choroplethData.geojson, {
                style: function (f) {
                    return { fillColor: color(featureValue(f)), weight: 1, color: BioRouterViz.colors.bg, fillOpacity: 0.8 };
                },
                onEachFeature: function (f, lyr) {
                    const v = featureValue(f);
                    const popup = document.createElement('div');
                    const title = document.createElement('strong'); title.textContent = featureName(f);
                    const value = document.createElement('p'); value.textContent = v == null ? 'No data' : String(v);
                    popup.append(title, value); lyr.bindPopup(popup);
                    lyr.on('mouseover', function (e) { e.target.setStyle({ weight: 3, color: BioRouterViz.colors.text }); info.update(f.properties, v); });
                    lyr.on('mouseout', function (e) { layer.resetStyle(e.target); info.update(); });
                }
            }).addTo(map);

            if (choroplethData.center) {
                map.setView([choroplethData.center.lat, choroplethData.center.lng], choroplethData.zoom ?? 4);
            } else {
                try { map.fitBounds(layer.getBounds().pad(0.05), { animate: false }); } catch (e) { map.setView([20, 0], 2); }
            }

            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function () {
                const div = L.DomUtil.create('div', 'legend');
                if (choroplethData.legendTitle) {
                    const title = document.createElement('strong'); title.textContent = choroplethData.legendTitle; div.appendChild(title);
                }
                const legendValues = span ? Array.from({ length: 5 }, (_, index) => vmin + span * index / 4) : [vmin];
                const labels = BioRouterViz.formatScaleValues(legendValues);
                const items = legendValues.map((value, index) => ({ label: labels[index], color: color(value) }));
                items.push({ label: 'No data', color: missingColor });
                items.forEach((item) => {
                    const row = document.createElement('div');
                    const swatch = document.createElement('i'); swatch.style.backgroundColor = item.color; swatch.setAttribute('aria-hidden', 'true');
                    const label = document.createElement('span'); label.textContent = item.label;
                    row.append(swatch, label); div.appendChild(row);
                });
                return div;
            };
            legend.addTo(map);

            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Region', 'Region ID', choroplethData.legendTitle || 'Value'],
                choroplethData.geojson.features.map((feature) => [featureName(feature), (feature.properties || {})[idProp || 'id'], featureValue(feature)]),
                'Missing or non-numeric observations are distinct from observed zero.');
            let previousWidth = document.getElementById('map').clientWidth;
            new ResizeObserver(() => {
                const width = document.getElementById('map').clientWidth;
                if (width === previousWidth) return;
                previousWidth = width; map.invalidateSize();
                if (!choroplethData.center) map.fitBounds(layer.getBounds().pad(0.05), { animate: false });
            }).observe(document.getElementById('map'));

            setTimeout(function () { map.invalidateSize(); BioRouterViz.reportSize(); }, 200);
        });
    </script>
</body>
</html>
