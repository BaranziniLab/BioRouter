<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dendrogram</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.link{fill:none;stroke:var(--muted);stroke-width:1.5px;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Dendrogram</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="chart" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
        </div>
    </div>
    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const dendrogramData = {{DENDROGRAM_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            document.getElementById('title').textContent = dendrogramData.name || 'Dendrogram';

            const root = d3.hierarchy(dendrogramData);
            const leaves = root.leaves().length;
            const height = Math.max(220, leaves * 28 + 60);
            const margin = { top: 20, right: 280, bottom: 20, left: 30 };
            const innerW = 760;
            const width = margin.left + innerW + margin.right;
            const svg = d3.select('#chart').attr('width', width).attr('height', height + margin.top + margin.bottom);
            const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

            d3.cluster().size([height, innerW])(root);

            g.selectAll('path.link').data(root.links()).join('path')
                .attr('class', 'link')
                .attr('d', function (d) {
                    return 'M' + d.target.y + ',' + d.target.x
                        + 'C' + (d.source.y + d.target.y) / 2 + ',' + d.target.x
                        + ' ' + (d.source.y + d.target.y) / 2 + ',' + d.source.x
                        + ' ' + d.source.y + ',' + d.source.x;
                });

            const node = g.selectAll('g.node').data(root.descendants()).join('g')
                .attr('transform', function (d) { return 'translate(' + d.y + ',' + d.x + ')'; });
            node.append('circle').attr('r', 4)
                .attr('fill', function (d) { return d.children ? BioRouterViz.colors.muted : BioRouterViz.palette[0]; });
            node.append('text')
                .attr('dy', 3)
                .attr('x', function (d) { return d.children ? -8 : 8; })
                .attr('text-anchor', function (d) { return d.children ? 'end' : 'start'; })
                .each(function (d) {
                    BioRouterViz.fitSvgLabel(this, d.depth ? d.data.name : '', d.children ? Math.min(220, d.y + margin.left - 20) : margin.right - 20);
                });

            BioRouterViz.hideOverlappingSvgLabels(svg.node(), 'text');
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Leaf', 'Hierarchy path', 'Supplied value'],
                root.leaves().map((leaf) => [leaf.data.name, leaf.ancestors().reverse().map((node) => node.data.name).join(' / '), leaf.data.value]),
                'The hierarchy is preserved; branch lengths are a layout, not measured distances.');

            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
