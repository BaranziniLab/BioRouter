<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treemap Visualization</title>
    
    {{ASSETS}}
    <script>{{COMMON}}</script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(12px, 2.5vw, 28px); background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1200px; min-width: 0; margin: 0 auto; }
        h1, .chart-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
        .figure-subtitle { margin: -6px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
        .figure-scroll { max-width: 100%; overflow: auto; }
        svg { display: block; }
        .tooltip { position: absolute; white-space: pre-line; opacity: 0; pointer-events: none; }
        .figure-data { max-width: 1200px; margin: 16px auto 0; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; overflow-wrap: anywhere; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; overflow-wrap: normal; }
        td { font-variant-numeric: tabular-nums; }
        .numeric { white-space: nowrap; }
        button { color: inherit; font: inherit; }
        button:focus-visible, summary:focus-visible, .figure-scroll:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .stats-panel { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
        .stat-card, .stat-item { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-title, .stat-label { font-size: 12px; }
        .chart-legend, .legend-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
        .legend-panel { margin-top: 14px; }
        .legend-title { font-weight: 500; }
        .legend-item { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; }
        .legend-label { min-width: 0; overflow-wrap: anywhere; }
        .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }
        .legend-color { width: 14px; height: 3px; flex: 0 0 14px; align-self: center; }
        .legend-item[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .treemap-rect { stroke: var(--bg); stroke-width: 2px; cursor: pointer; }
        .treemap-rect:hover { stroke: var(--text); }
        .treemap-text, .treemap-value { font-size: 14px; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
        .group-label { font-size: 14px; font-weight: 500; pointer-events: none; }
        #resetTreemap { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); padding: 5px 9px; margin-bottom: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="figureTitle">Hierarchical values</h1>
        <button id="resetTreemap" type="button">Show all groups</button>
        <div class="treemap-container figure-scroll" tabindex="0" aria-label="Treemap" id="treemap"></div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>

    <script>

        BioRouterViz.applyPageTheme();

        // Data will be injected here
        const treemapData = {{TREEMAP_DATA}};
        
        let currentData = treemapData;
        let currentRoot = treemapData;
        let svg, treemap, root;
        
        const width = 800;
        const height = 500;
        
        // Color scheme for different categories
        const colorScale = d3.scaleOrdinal(BioRouterViz.palette);
        
        function initializeTreemap() {
            const container = d3.select("#treemap");
            container.selectAll("*").remove();
            
            svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("role", "img")
                .attr("aria-label", "Hierarchical values; Names and values follow in the data table");
            
            treemap = d3.treemap()
                .size([width, height])
                .padding(2)
                .round(true);
        }
        
        function updateTreemap(data, isRoot = true) {
            currentData = data;
            if (isRoot) {
                currentRoot = data;
            }
            
            // Create hierarchy and calculate layout
            root = d3.hierarchy(data)
                .sum(d => d.value || 0)
                .sort((a, b) => b.value - a.value);
            
            treemap(root);
            
            // Clear previous content
            svg.selectAll("*").remove();
            
            // Create leaf nodes
            const leaf = svg.selectAll("g")
                .data(root.leaves())
                .join("g")
                .attr("transform", d => `translate(${d.x0},${d.y0})`);
            
            // Add rectangles
            leaf.append("rect")
                .attr("class", "treemap-rect")
                .attr("fill", d => {
                    // Use category for color, or parent name if no category
                    const colorKey = d.data.category || d.parent?.data.name || 'default';
                    return colorScale(colorKey);
                })
                .attr("width", d => d.x1 - d.x0)
                .attr("height", d => d.y1 - d.y0)
                .on("mouseover", function(event, d) {
                    showTooltip(event, d);
                })
                .on("mousemove", function(event, d) {
                    moveTooltip(event);
                })
                .on("mouseout", function() {
                    hideTooltip();
                })
                .on("click", function(event, d) {
                    // Navigate to parent if it has children
                    if (d.parent && d.parent.data.children) {
                        updateTreemap(d.parent.data, false);
                    }
                });
            
            // Add text labels
            leaf.append("text")
                .attr("class", "treemap-text")
                .attr("x", d => (d.x1 - d.x0) / 2)
                .attr("y", d => (d.y1 - d.y0) / 2 - 5)
                .text(d => d.data.name)
                .style("fill", BioRouterViz.theme === 'dark' ? '#1b1b19' : '#ffffff')
                .each(function(d) {
                    BioRouterViz.fitSvgLabel(this, d.data.name, d.x1 - d.x0 - 12);
                    if (d.y1 - d.y0 < 42) this.textContent = '';
                });
            
            // Add value labels
            leaf.append("text")
                .attr("class", "treemap-value")
                .attr("x", d => (d.x1 - d.x0) / 2)
                .attr("y", d => (d.y1 - d.y0) / 2 + 10)
                .text(d => formatValue(d.value))
                .style("fill", BioRouterViz.theme === 'dark' ? '#1b1b19' : '#ffffff')
                .each(function(d) {
                    if (d.y1 - d.y0 < 42 || this.getComputedTextLength() > d.x1 - d.x0 - 12) this.textContent = '';
                });
            
            // Add group boundaries and labels for navigation (if data has children)
            if (data.children) {
                // Add group rectangles for visual hierarchy
                const groups = svg.selectAll(".group-rect")
                    .data(root.children || [])
                    .join("rect")
                    .attr("class", "group-rect")
                    .attr("x", d => d.x0)
                    .attr("y", d => d.y0)
                    .attr("width", d => d.x1 - d.x0)
                    .attr("height", d => d.y1 - d.y0)
                    .attr("fill", "none")
                    .attr("stroke", BioRouterViz.colors.bg)
                    .attr("stroke-width", 2)
                    .attr("stroke-dasharray", "3,3")
                    .style("cursor", "pointer")
                    .style("pointer-events", "none");
                
                // Add group labels
                svg.selectAll(".group-label")
                    .data(root.children || [])
                    .join("text")
                    .attr("class", "group-label")
                    .attr("x", d => d.x0 + 5)
                    .attr("y", d => d.y0 + 15)
                    .text(d => d.data.name)
                    .style("fill", BioRouterViz.theme === 'dark' ? '#1b1b19' : '#ffffff')
                    .each(function(d) {
                        BioRouterViz.fitSvgLabel(this, d.data.name, d.x1 - d.x0 - 12);
                        if (d.y1 - d.y0 < 90 || d.x1 - d.x0 < 100) this.textContent = '';
                    });
            }
            BioRouterViz.hideOverlappingSvgLabels(svg.node(), '.treemap-text, .treemap-value, .group-label');
        }
        
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            const percentage = (root.value ? (d.value / root.value) * 100 : 0).toFixed(1);
            
            tooltip.textContent = d.data.name + '\nValue: ' + formatValue(d.value) +
                '\nShare: ' + percentage + '%' + (d.parent ? '\nParent: ' + d.parent.data.name : '');
            tooltip.style.opacity = 1;
            moveTooltip(event);
        }
        
        function moveTooltip(event) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }
        
        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.opacity = 0;
        }
        
        function formatValue(value) {
            if (value >= 1000000) {
                return (value / 1000000).toFixed(1) + 'M';
            } else if (value >= 1000) {
                return (value / 1000).toFixed(1) + 'K';
            }
            return value.toLocaleString();
        }
        
        // Function to measure and report content size for iframe auto-resizing
        function reportContentSize() {
            // Get the actual content height
            const contentHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            
            // Send size change message to parent window (for MCP-UI iframe auto-resize)
            // The message format must match what the MCP-UI client expects
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'ui-size-change',  // lowercase as expected by MCP-UI client
                    payload: {
                        height: contentHeight
                        // width is optional, we're not setting it to allow responsive design
                    }
                }, '*');
            }
        }
        
        // Initialize and render on load
        window.onload = function() {
            initializeTreemap();
            updateTreemap(treemapData);
            document.getElementById('figureTitle').textContent = treemapData.name || 'Hierarchical values';
            document.getElementById('resetTreemap').addEventListener('click', () => updateTreemap(treemapData));
            const leaves = d3.hierarchy(treemapData).sum((node) => node.value || 0).leaves();
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Path', 'Category', 'Value'], leaves.map((node) =>
                [node.ancestors().reverse().map((part) => part.data.name).join(' / '), node.data.category, node.data.value]),
                'leaf values; click a rectangle to focus its group.');
            BioRouterViz.autoResize();
            
            // Report initial size
            setTimeout(reportContentSize, 100);
            
            // Watch for size changes using ResizeObserver if available
            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    reportContentSize();
                });
                resizeObserver.observe(document.body);
                resizeObserver.observe(document.documentElement);
            }
            
            // Fallback: also report on window resize
            window.addEventListener('resize', reportContentSize);
        };
    </script>
</body>
</html>
