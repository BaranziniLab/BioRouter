<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauge</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>
        .chart-wrap { position: relative; height: clamp(240px, 48vw, 320px); }
    </style>
</head>
<body>
    <div class="viz-root">
        <div class="container" style="max-width:640px">
            <div class="header"><h1 id="title">Gauge</h1></div>
            <p class="figure-description" id="gaugeLabel"></p>
            <div class="chart-wrap"><canvas id="chart" role="img" aria-label="Gauge; exact measurement and range follow in the data table"></canvas></div>
            <p class="figure-description" id="rangeDescription"></p>
        </div>
    </div>
    <details class="figure-data" style="max-width:640px">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const gaugeData = {{GAUGE_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            BioRouterViz.applyChartDefaults();
            if (gaugeData.title) document.getElementById('title').textContent = gaugeData.title;
            document.getElementById('gaugeLabel').textContent = gaugeData.label || '';

            const min = (typeof gaugeData.min === 'number') ? gaugeData.min : 0;
            const max = (typeof gaugeData.max === 'number') ? gaugeData.max : 100;
            const value = gaugeData.value;
            const displayedValue = Math.max(min, Math.min(max, value));
            const scale = Math.max(Math.abs(min), Math.abs(max), 1);
            const frac = (displayedValue / scale - min / scale) / (max / scale - min / scale);
            const rangeNote = 'Range: ' + min + '–' + max + (gaugeData.label ? ' ' + gaugeData.label : '') + '.' +
                (value < min ? ' Measurement is below the range; only the arc is clipped.' :
                    value > max ? ' Measurement is above the range; only the arc is clipped.' : '');
            document.getElementById('rangeDescription').textContent = rangeNote;
            document.getElementById('chart').setAttribute('aria-label', 'Measurement: ' + value + '. ' + rangeNote);

            // Pick colour from the first ascending threshold band that contains the value.
            let color = BioRouterViz.palette[0];
            if (Array.isArray(gaugeData.thresholds) && gaugeData.thresholds.length) {
                const sorted = gaugeData.thresholds.slice().sort(function (a, b) { return a.value - b.value; });
                for (let i = 0; i < sorted.length; i++) {
                    if (value <= sorted[i].value) { color = sorted[i].color; break; }
                    color = sorted[i].color;
                }
            }
            const track = BioRouterViz.dark ? '#3a4150' : '#e5e7eb';

            const centerText = {
                id: 'centerText',
                afterDraw: function (chart) {
                    const ctx = chart.ctx;
                    const cx = (chart.chartArea.left + chart.chartArea.right) / 2;
                    const cy = chart.chartArea.bottom - 8;
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.fillStyle = BioRouterViz.colors.text;
                    const text = String(value);
                    ctx.font = '600 44px -apple-system, sans-serif';
                    const available = Math.max(1, chart.chartArea.right - chart.chartArea.left - 24);
                    const measured = ctx.measureText(text).width;
                    const size = Math.min(44, 44 * available / Math.max(1, measured));
                    ctx.font = '600 ' + size + 'px -apple-system, sans-serif';
                    ctx.fillText(text, cx, cy - 18);
                    ctx.restore();
                }
            };

            new Chart(document.getElementById('chart').getContext('2d'), {
                type: 'doughnut',
                data: { datasets: [{ data: [frac, 1 - frac], backgroundColor: [color, track], borderWidth: 0 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    rotation: -90, circumference: 180, cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                },
                plugins: [centerText]
            });
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Quantity', 'Value'], [
                ['Measurement', value], ['Minimum', min], ['Maximum', max], ['Arc endpoint', displayedValue]
            ], rangeNote);
            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
