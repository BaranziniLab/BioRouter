<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaplan–Meier</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>.tooltip{position:absolute;opacity:0;pointer-events:none;}</style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Kaplan–Meier</h1></div>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Scientific figure"><svg id="chart" role="img" aria-label="Scientific figure; exact values follow in the data table"></svg></div>
            <div class="figure-legend" id="groupLegend"></div>
        </div>
    </div>
    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>
    <script>
        const kmData = {{KM_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            if (kmData.title) document.getElementById('title').textContent = kmData.title;

            const margin = { top: 24, right: 24, bottom: 72, left: 76 };
            const innerW = 700, innerH = 420;
            const svg = d3.select('#chart').attr('width', margin.left + innerW + margin.right).attr('height', margin.top + innerH + margin.bottom);
            const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

            let maxT = 0;
            kmData.groups.forEach(function (grp) { grp.points.forEach(function (p) { if (p.time > maxT) maxT = p.time; }); });
            const x = d3.scaleLinear().domain([0, maxT || 1]).range([0, innerW]);
            const y = d3.scaleLinear().domain([0, 1]).range([innerH, 0]);

            g.append('g').attr('transform', 'translate(0,' + innerH + ')').call(d3.axisBottom(x));
            g.append('g').call(d3.axisLeft(y).tickFormat(d3.format('.0%')));
            g.append('text').attr('x', innerW / 2).attr('y', innerH + 52).attr('text-anchor', 'middle')
                .each(function () { BioRouterViz.fitSvgLabel(this, kmData.xAxisLabel || 'Time', innerW); });
            g.append('text').attr('transform', 'rotate(-90)').attr('x', -innerH / 2).attr('y', -54).attr('text-anchor', 'middle')
                .each(function () { BioRouterViz.fitSvgLabel(this, kmData.yAxisLabel || 'Survival probability', innerH); });

            const step = d3.line().curve(d3.curveStepAfter).x(function (d) { return x(d.time); }).y(function (d) { return y(d.survival); });

            kmData.groups.forEach(function (grp, i) {
                const col = grp.color || BioRouterViz.palette[i % BioRouterViz.palette.length];
                const pts = grp.points.slice().sort(function (a, b) { return a.time - b.time; });
                g.append('path').datum(pts).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 2)
                    .attr('stroke-dasharray', i % 2 ? '6,3' : null).attr('d', step);
                // Censoring ticks.
                pts.filter(function (p) { return p.censored; }).forEach(function (p) {
                    g.append('line').attr('x1', x(p.time)).attr('x2', x(p.time)).attr('y1', y(p.survival) - 5).attr('y2', y(p.survival) + 5).attr('stroke', col).attr('stroke-width', 1.5);
                });
            });
            BioRouterViz.renderFigureLegend(document.getElementById('groupLegend'), kmData.groups.map((group, index) => ({
                label: group.label, color: group.color || BioRouterViz.palette[index % BioRouterViz.palette.length], dashed: Boolean(index % 2)
            })));
            const rows = kmData.groups.flatMap((group) => group.points.slice().sort((a, b) => a.time - b.time)
                .map((point) => [group.label, point.time, point.survival, point.censored ? 'Yes' : 'No']));
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Group', kmData.xAxisLabel || 'Time', kmData.yAxisLabel || 'Survival probability', 'Censored'],
                rows, 'Supplied cumulative survival probabilities; censor marks do not add a survival drop.');
            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
