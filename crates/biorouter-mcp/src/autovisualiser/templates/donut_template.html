<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut & Pie Charts</title>

    {{ASSETS}}
    <script>{{COMMON}}</script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(12px, 2.5vw, 28px); background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1200px; min-width: 0; margin: 0 auto; }
        h1, .chart-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
        .figure-subtitle { margin: -6px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
        .figure-scroll { max-width: 100%; overflow: auto; }
        svg { display: block; }
        .tooltip { position: absolute; white-space: pre-line; opacity: 0; pointer-events: none; }
        .figure-data { max-width: 1200px; margin: 16px auto 0; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; overflow-wrap: anywhere; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; overflow-wrap: normal; }
        td { font-variant-numeric: tabular-nums; }
        .numeric { white-space: nowrap; }
        button { color: inherit; font: inherit; }
        button:focus-visible, summary:focus-visible, .figure-scroll:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .stats-panel { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
        .stat-card, .stat-item { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-title, .stat-label { font-size: 12px; }
        .chart-legend, .legend-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
        .legend-panel { margin-top: 14px; }
        .legend-title { font-weight: 500; }
        .legend-item { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; }
        .legend-label { min-width: 0; overflow-wrap: anywhere; }
        .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }
        .legend-color { width: 14px; height: 3px; flex: 0 0 14px; align-self: center; }
        .legend-item[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px; }
        .chart-wrapper { min-width: 0; }
        .chart-container { position: relative; height: clamp(260px, 35vw, 350px); min-width: 0; }
        .chart-legend { display: grid; grid-template-columns: minmax(0, 1fr); }
        .legend-value { margin-left: auto; white-space: nowrap; }
        .empty-chart { color: var(--muted); margin: 0; padding: 16px 0; }
    </style>
</head>
<body>
    <div class="container">        
        <div class="charts-grid" id="chartsGrid">
            <!-- Charts will be dynamically inserted here -->
        </div>
        
        <details class="figure-data"><summary>Summary statistics</summary>
            <div class="stats-panel" id="statsPanel"></div>
        </details>
    </div>

    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>

    <script>

        BioRouterViz.applyPageTheme();

        // Data will be injected here
        const chartsData = {{CHARTS_DATA}};
        BioRouterViz.applyChartDefaults();
        
        // Default color palette
        const defaultColors = BioRouterViz.palette;
        
        function getColor(index, alpha = 1) {
            const color = defaultColors[index % defaultColors.length];
            return alpha === 1 ? color : color + Math.round(alpha * 255).toString(16).padStart(2, '0');
        }
        
        function processChartData(data) {
            // Ensure we have an array of charts
            const charts = Array.isArray(data) ? data : [data];
            
            return charts.map(chart => {
                // Process labels and data
                const labels = chart.labels || chart.data.map((d, i) => d.label || `Item ${i + 1}`);
                const values = chart.data.map(d => typeof d === 'object' ? d.value : d);
                
                // Auto-assign colors if not provided
                const backgroundColors = chart.backgroundColor || 
                    chart.data.map((d, i) => {
                        if (typeof d === 'object' && d.color) return d.color;
                        return getColor(i, 0.8);
                    });
                    
                const borderColors = chart.borderColor || 
                    backgroundColors.map(c => c.replace('0.8)', '1)'));
                
                return {
                    title: chart.title || 'Chart',
                    type: chart.type || 'doughnut',
                    labels: labels,
                    values: values,
                    backgroundColors: backgroundColors,
                    borderColors: borderColors
                };
            });
        }
        
        function createChart(chartData, canvasId) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            return new Chart(ctx, {
                type: chartData.type,
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        data: chartData.values,
                        backgroundColor: chartData.backgroundColors,
                        borderColor: chartData.borderColors,
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false // We'll create custom legend
                        },
                        tooltip: {
                            displayColors: true,
                            callbacks: {
                                title: (items) => items.length ? BioRouterViz.wrapChartTooltip(items[0].label, items[0].chart) : [],
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = (total ? (value / total) * 100 : 0).toFixed(1);
                                    return BioRouterViz.wrapChartTooltip(`${label}: ${value.toLocaleString()} (${percentage}%)`, context.chart);
                                }
                            }
                        }
                    },
                    animation: false,
                    cutout: chartData.type === 'doughnut' ? '50%' : '0%'
                }
            });
        }
        
        function createLegend(chartData, container, chart) {
            const total = chartData.values.reduce((sum, value) => sum + value, 0);
            chartData.labels.forEach((label, index) => {
                const button = document.createElement(chart ? 'button' : 'div');
                button.className = 'legend-item';
                if (chart) { button.type = 'button'; button.setAttribute('aria-pressed', 'true'); }
                const swatch = document.createElement('span');
                swatch.className = 'legend-color'; swatch.style.backgroundColor = chartData.backgroundColors[index];
                swatch.setAttribute('aria-hidden', 'true');
                const name = document.createElement('span'); name.className = 'legend-label'; name.textContent = label;
                const value = document.createElement('span'); value.className = 'legend-value';
                value.textContent = chartData.values[index].toLocaleString() + ' (' +
                    (total ? chartData.values[index] / total * 100 : 0).toFixed(1) + '%)';
                button.append(swatch, name, value);
                if (chart) button.addEventListener('click', () => {
                    chart.toggleDataVisibility(index);
                    button.setAttribute('aria-pressed', String(chart.getDataVisibility(index)));
                    chart.update();
                });
                container.appendChild(button);
            });
        }
        
        function renderCharts() {
            const processedData = processChartData(chartsData);
            const chartsGrid = document.getElementById('chartsGrid');
            
            // Clear existing content
            chartsGrid.innerHTML = '';
            
            // Create chart elements
            processedData.forEach((chartData, index) => {
                const canvasId = `chart-${index}`;
                const legendId = `legend-${index}`;
                
                const chartWrapper = document.createElement('div');
                chartWrapper.className = 'chart-wrapper';
                const title = document.createElement('h2');
                title.className = 'chart-title'; title.id = 'chart-title-' + index; title.textContent = chartData.title;
                const host = document.createElement('div'); host.className = 'chart-container';
                const canvas = document.createElement('canvas'); canvas.id = canvasId;
                canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-labelledby', title.id);
                const empty = chartData.values.every((value) => value === 0);
                if (empty) {
                    host.className = 'empty-chart'; host.setAttribute('role', 'status');
                    host.textContent = 'All values are zero.';
                } else host.appendChild(canvas);
                const legend = document.createElement('div'); legend.className = 'chart-legend'; legend.id = legendId;
                chartWrapper.append(title, host, legend);
                
                chartsGrid.appendChild(chartWrapper);
                
                // Create the chart
                const chart = empty ? null : createChart(chartData, canvasId);
                
                // Create the legend
                createLegend(chartData, document.getElementById(legendId), chart);
            });
            
            // Update statistics
            updateStats(processedData);
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Figure', 'Category', 'Value'], processedData.flatMap((figure) =>
                figure.labels.map((label, index) => [figure.title, label, figure.values[index]])),
                'Values for each figure.');
        }
        
        function updateStats(processedData) {
            const statsPanel = document.getElementById('statsPanel');
            
            // Calculate overall statistics
            let totalValue = 0;
            let totalCategories = 0;
            let maxValue = 0;
            let minValue = Infinity;
            
            processedData.forEach(chart => {
                const chartTotal = chart.values.reduce((a, b) => a + b, 0);
                const chartMax = Math.max(...chart.values);
                const chartMin = Math.min(...chart.values);
                
                totalValue += chartTotal;
                totalCategories += chart.values.length;
                maxValue = Math.max(maxValue, chartMax);
                minValue = Math.min(minValue, chartMin);
            });
            
            const avgValue = totalCategories > 0 ? totalValue / totalCategories : 0;
            
            statsPanel.innerHTML = `
                <div class="stat-card">
                    <div class="stat-title">Total Charts</div>
                    <div class="stat-value">${processedData.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Total Value</div>
                    <div class="stat-value">${totalValue.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Total Categories</div>
                    <div class="stat-value">${totalCategories}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Average Value</div>
                    <div class="stat-value">${avgValue.toFixed(0).toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Max Value</div>
                    <div class="stat-value">${maxValue.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Min Value</div>
                    <div class="stat-value">${minValue.toLocaleString()}</div>
                </div>
            `;
        }
        
        // Function to measure and report content size for iframe auto-resizing
        function reportContentSize() {
            // Get the actual content height
            const contentHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            
            // Send size change message to parent window (for MCP-UI iframe auto-resize)
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'ui-size-change',
                    payload: {
                        height: contentHeight
                    }
                }, '*');
            }
        }
        
        // Initialize on load
        window.onload = function() {
            renderCharts();
            BioRouterViz.autoResize();
            
            // Report initial size
            setTimeout(reportContentSize, 100);
            
            // Watch for size changes using ResizeObserver if available
            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    reportContentSize();
                });
                resizeObserver.observe(document.body);
                resizeObserver.observe(document.documentElement);
            }
            
            // Fallback: also report on window resize
            window.addEventListener('resize', reportContentSize);
        };
    </script>
</body>
</html>
