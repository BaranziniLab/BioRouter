<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Chart</title>

    {{ASSETS}}
    <script>{{COMMON}}</script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(12px, 2.5vw, 28px); background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 1200px; min-width: 0; margin: 0 auto; }
        h1, .chart-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 22px); font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
        .figure-subtitle { margin: -6px 0 14px; color: var(--muted); overflow-wrap: anywhere; }
        .figure-scroll { max-width: 100%; overflow: auto; }
        svg { display: block; }
        .tooltip { position: absolute; white-space: pre-line; opacity: 0; pointer-events: none; }
        .figure-data { max-width: 1200px; margin: 16px auto 0; padding-top: 10px; border-top: 1px solid var(--border); }
        summary { width: fit-content; color: var(--muted); cursor: pointer; }
        .table-scroll { max-height: 360px; overflow: auto; margin-top: 10px; }
        table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; text-align: left; }
        caption { text-align: left; color: var(--muted); padding-bottom: 8px; overflow-wrap: anywhere; }
        th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
        th { font-weight: 600; overflow-wrap: normal; }
        td { font-variant-numeric: tabular-nums; }
        .numeric { white-space: nowrap; }
        button { color: inherit; font: inherit; }
        button:focus-visible, summary:focus-visible, .figure-scroll:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .stats-panel { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
        .stat-card, .stat-item { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
        .stat-title, .stat-label { font-size: 12px; }
        .chart-legend, .legend-items { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
        .legend-panel { margin-top: 14px; }
        .legend-title { font-weight: 500; }
        .legend-item { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; }
        .legend-label { min-width: 0; overflow-wrap: anywhere; }
        .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }
        .legend-color { width: 14px; height: 3px; flex: 0 0 14px; align-self: center; }
        .legend-item[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
        .chart-container { position: relative; width: 100%; min-width: 0; height: clamp(360px, 70vw, 560px); }
        #radarChart { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        
        <h1>Category profiles</h1>
        <div class="chart-container">
            <canvas id="radarChart" role="img" aria-label="Category profiles; Values follow in the data table"></canvas>
        </div>
        
        <div class="stats-panel" id="statsPanel">
            <div class="stat-item">
                <div class="stat-value" id="dimensions">0</div>
                <div class="stat-label">Dimensions</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="datasets">0</div>
                <div class="stat-label">Datasets</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="maxScore">0</div>
                <div class="stat-label">Max Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="avgScore">0</div>
                <div class="stat-label">Average</div>
            </div>
        </div>
        
        <div class="legend-panel">
            <div class="legend-title">Dataset Legend</div>
            <div class="legend-items" id="legendItems">
                <!-- Legend items will be populated by JavaScript -->
            </div>
        </div>
        
        <div class="tooltip" id="tooltip"></div>
    </div>

    <details class="figure-data">
        <summary>View figure data</summary>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div>
    </details>

    <script>

        BioRouterViz.applyPageTheme();

        // Data will be injected here
        const radarData = {{RADAR_DATA}};
        BioRouterViz.applyChartDefaults();

        let chart;
        
        // Default color schemes for datasets
        const defaultColors = BioRouterViz.palette;
        
        function getColor(index, alpha = 1) {
            const color = defaultColors[index % defaultColors.length];
            return alpha === 1 ? color : color + Math.round(alpha * 255).toString(16).padStart(2, '0');
        }
        
        function processData(data) {
            // Ensure datasets have proper colors and styling
            const processedData = {
                labels: data.labels || [],
                datasets: (data.datasets || []).map((dataset, index) => {
                    const borderColor = dataset.borderColor || getColor(index);
                    const backgroundColor = dataset.backgroundColor || getColor(index, 0.2);
                    
                    return {
                        label: dataset.label || `Dataset ${index + 1}`,
                        data: dataset.data || [],
                        borderColor: borderColor,
                        backgroundColor: backgroundColor,
                        borderWidth: dataset.borderWidth ?? 2,
                        pointBackgroundColor: dataset.pointBackgroundColor || borderColor,
                        pointBorderColor: dataset.pointBorderColor || BioRouterViz.colors.bg,
                        pointHoverBackgroundColor: dataset.pointHoverBackgroundColor || BioRouterViz.colors.bg,
                        pointHoverBorderColor: dataset.pointHoverBorderColor || borderColor,
                        fill: dataset.fill !== undefined ? dataset.fill : true,
                        pointRadius: dataset.pointRadius !== undefined ? dataset.pointRadius : 4,
                        pointHoverRadius: dataset.pointHoverRadius !== undefined ? dataset.pointHoverRadius : 6
                    };
                })
            };
            
            return processedData;
        }
        
        function initChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            const data = processData(radarData);
            
            // Determine scale max from data
            let maxValue = 100;
            if (data.datasets.length > 0) {
                const allValues = data.datasets.flatMap(d => d.data);
                const dataMax = Math.max(...allValues);
                maxValue = Math.max(10, Math.ceil(dataMax / 10) * 10); // Round up to nearest 10
            }
            
            chart = new Chart(ctx, {
                type: 'radar',
                data: data,
                plugins: [{
                    id: 'readableRadialTicks',
                    afterDraw(chart) {
                        const scale = chart.scales.r;
                        const context = chart.ctx;
                        context.save();
                        context.font = '14px ' + Chart.defaults.font.family;
                        context.fillStyle = BioRouterViz.colors.muted;
                        context.textAlign = 'right'; context.textBaseline = 'middle';
                        scale.ticks.forEach((tick) => {
                            if (!tick.value) return;
                            const point = scale.getPointPositionForValue(0, tick.value);
                            context.fillText(tick.label, point.x - 10, point.y);
                        });
                        context.restore();
                    }
                }],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            displayColors: true,
                            callbacks: {
                                title: (items) => items.length ? BioRouterViz.wrapChartTooltip(items[0].label, items[0].chart) : [],
                                label: function(context) {
                                    const value = context.parsed.r;
                                    const percentage = ((value / maxValue) * 100).toFixed(1);
                                    return BioRouterViz.wrapChartTooltip(`${context.dataset.label}: ${value} (${percentage}%)`, context.chart);
                                }
                            }
                        }
                    },
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: maxValue,
                            min: 0,
                            ticks: {
                                display: false,
                                stepSize: maxValue / 5,
                                font: {
                                    size: 14
                                },
                                color: BioRouterViz.colors.muted,
                                backdropColor: BioRouterViz.colors.bg
                            },
                            grid: {
                                color: BioRouterViz.colors.grid
                            },
                            angleLines: {
                                color: BioRouterViz.colors.grid
                            },
                            pointLabels: {
                                display: data.labels.length <= 16,
                                font: { size: 14, weight: '500' },
                                color: BioRouterViz.colors.text,
                                callback: (label, index) => {
                                    ctx.save(); ctx.font = '14px ' + Chart.defaults.font.family;
                                    const fits = ctx.measureText(label).width <= Math.max(60, Math.min(140, ctx.canvas.clientWidth * 0.18));
                                    ctx.restore();
                                    return fits ? label : String(index + 1);
                                }
                            }
                        }
                    },
                    animation: false,
                    interaction: {
                        intersect: false,
                        mode: 'point'
                    }
                }
            });
            
            updateStats();
            updateLegend();
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Dimension', 'Category', ...data.datasets.map((dataset) => dataset.label)],
                data.labels.map((label, index) => [index + 1, label, ...data.datasets.map((dataset) => dataset.data[index])]),
                'Category values; numbers identify shortened axis labels.');
        }
        
        function updateStats() {
            const data = processData(radarData);
            const dimensions = data.labels.length;
            const datasets = data.datasets.length;
            
            let allValues = [];
            data.datasets.forEach(dataset => {
                allValues = allValues.concat(dataset.data);
            });
            
            const maxScore = allValues.length > 0 ? Math.max(...allValues) : 0;
            const avgScore = allValues.length > 0 
                ? allValues.reduce((a, b) => a + b, 0) / allValues.length 
                : 0;
            
            document.getElementById('dimensions').textContent = dimensions;
            document.getElementById('datasets').textContent = datasets;
            document.getElementById('maxScore').textContent = maxScore.toFixed(0);
            document.getElementById('avgScore').textContent = avgScore.toFixed(1);
        }
        
        function updateLegend() {
            const legendContainer = document.getElementById('legendItems');
            const data = processData(radarData);
            
            legendContainer.innerHTML = '';
            
            data.datasets.forEach((dataset, index) => {
                const legendItem = document.createElement('button');
                legendItem.type = 'button';
                legendItem.setAttribute('aria-pressed', 'true');
                legendItem.addEventListener('click', () => {
                    const visible = !chart.isDatasetVisible(index);
                    chart.setDatasetVisibility(index, visible);
                    legendItem.setAttribute('aria-pressed', String(visible)); chart.update();
                });
                legendItem.className = 'legend-item';
                
                const colorBox = document.createElement('div');
                colorBox.className = 'legend-color';
                colorBox.style.backgroundColor = dataset.borderColor;
                
                const label = document.createElement('span');
                label.className = 'legend-label';
                label.textContent = dataset.label;
                
                legendItem.appendChild(colorBox);
                legendItem.appendChild(label);
                legendContainer.appendChild(legendItem);
            });
        }
        
        // Function to measure and report content size for iframe auto-resizing
        function reportContentSize() {
            // Get the actual content height
            const contentHeight = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.clientHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            
            // Send size change message to parent window (for MCP-UI iframe auto-resize)
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'ui-size-change',
                    payload: {
                        height: contentHeight
                    }
                }, '*');
            }
        }
        
        // Initialize and render on load
        window.onload = function() {
            initChart();
            BioRouterViz.autoResize();
            
            // Report initial size
            setTimeout(reportContentSize, 100);
            
            // Watch for size changes using ResizeObserver if available
            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    reportContentSize();
                });
                resizeObserver.observe(document.body);
                resizeObserver.observe(document.documentElement);
            }
            
            // Fallback: also report on window resize
            window.addEventListener('resize', reportContentSize);
        };
    </script>
</body>
</html>
