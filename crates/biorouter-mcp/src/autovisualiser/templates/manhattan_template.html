<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhattan Plot</title>
    {{ASSETS}}
    <script>{{COMMON}}</script>
    <style>
        .chart-wrap { position: relative; height: 480px; }
    </style>
</head>
<body>
    <div class="viz-root">
        <div class="container">
            <div class="header"><h1 id="title">Manhattan Plot</h1></div>
            <p class="figure-description" id="thresholdDescription"></p>
            <div class="figure-scroll" tabindex="0" role="region" aria-label="Manhattan plot"><div class="chart-wrap" id="chartHost"><canvas id="chart" role="img" aria-label="Manhattan plot; exact chromosome positions and values follow in the figure data"></canvas></div></div>
        </div>
    </div>
    <details class="figure-data"><summary>View figure data</summary><div class="table-scroll" tabindex="0" role="region" aria-label="Figure data"><table id="figureData"></table></div></details>
    <script>
        const manhattanData = {{MANHATTAN_DATA}};
        BioRouterViz.autoResize();
        BioRouterViz.guard(function () {
            BioRouterViz.applyScientificStyles();
            BioRouterViz.applyChartDefaults();
            if (manhattanData.title) document.getElementById('title').textContent = manhattanData.title;

            const sigLine = (typeof manhattanData.significanceLine === 'number') ? manhattanData.significanceLine : 7.301;
            const thresholdNote = 'Dashed line: −log₁₀(p) = ' + sigLine + '. Chromosomes are concatenated across their observed position ranges.';
            document.getElementById('thresholdDescription').textContent = thresholdNote;

            // Natural chromosome order: 1..22, X, Y, MT, then anything else.
            function chromRank(c) {
                c = String(c).replace(/^chr/i, '');
                const n = parseInt(c, 10);
                if (!isNaN(n)) return n;
                if (/^x$/i.test(c)) return 23;
                if (/^y$/i.test(c)) return 24;
                if (/^(mt|m)$/i.test(c)) return 25;
                return 99;
            }
            const byChrom = new Map();
            manhattanData.points.forEach(function (p) {
                const k = String(p.chrom).replace(/^chr/i, '');
                if (!byChrom.has(k)) byChrom.set(k, []);
                byChrom.get(k).push(p);
            });
            const chroms = Array.from(byChrom.keys()).sort(function (a, b) { return chromRank(a) - chromRank(b) || (a < b ? -1 : 1); });

            // Lay chromosomes side by side on a cumulative axis.
            let offset = 0;
            const datasets = [];
            const tickPositions = [];
            const colA = BioRouterViz.palette[0], colB = BioRouterViz.palette[1];
            chroms.forEach(function (chrom, ci) {
                const pts = byChrom.get(chrom).slice().sort(function (a, b) { return a.pos - b.pos; });
                const minPos = pts.length ? pts[0].pos : 0;
                const maxPos = pts.length ? pts[pts.length - 1].pos : 0;
                const span = (maxPos - minPos) || 1;
                const data = pts.map(function (p) {
                    return { x: offset + (p.pos - minPos), y: p.negLog10P, _label: p.label, _chrom: chrom, _pos: p.pos };
                });
                tickPositions.push({ chrom: chrom, mid: offset + span / 2 });
                datasets.push({
                    label: 'chr' + chrom,
                    data: data,
                    backgroundColor: (ci % 2 === 0) ? colA : colB,
                    pointRadius: 3, pointHoverRadius: 5
                });
                offset += span + span * 0.05 + 1;
            });

            const sig = {
                id: 'sig',
                afterDraw: function (chart) {
                    const ctx = chart.ctx, ys = chart.scales.y, xs = chart.scales.x;
                    const py = ys.getPixelForValue(sigLine);
                    ctx.save();
                    ctx.beginPath(); ctx.rect(xs.left, ys.top, xs.right - xs.left, ys.bottom - ys.top); ctx.clip();
                    ctx.strokeStyle = BioRouterViz.colors.muted;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath(); ctx.moveTo(xs.left, py); ctx.lineTo(xs.right, py); ctx.stroke();
                    ctx.restore();
                }
            };

            new Chart(document.getElementById('chart').getContext('2d'), {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: function (ctx) {
                            const p = ctx.raw;
                            return BioRouterViz.wrapChartTooltip((p._label ? p._label + ' — ' : '') + 'chr' + p._chrom + ':' + p._pos + ', -log10p=' + p.y, ctx.chart);
                        } } }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Chromosome' },
                            grid: { display: false },
                            ticks: {
                                autoSkip: true,
                                maxRotation: 0,
                                callback: function (val) {
                                    let best = null, bestD = Infinity;
                                    tickPositions.forEach(function (t) { const dd = Math.abs(t.mid - val); if (dd < bestD) { bestD = dd; best = t; } });
                                    return best ? best.chrom : '';
                                }
                            },
                            afterBuildTicks: function (axis) { axis.ticks = tickPositions.map(function (t) { return { value: t.mid }; }); }
                        },
                        y: { title: { display: true, text: '−log₁₀(p)' }, suggestedMax: sigLine, beginAtZero: true, grid: { color: BioRouterViz.colors.grid } }
                    }
                },
                plugins: [sig]
            });
            function* rows() {
                for (const dataset of datasets) for (const point of dataset.data) yield [point._label || '—', point._chrom, point._pos, point.y];
            }
            BioRouterViz.renderFigureData(document.getElementById('figureData'), ['Feature', 'Chromosome', 'Position', '−log₁₀(p)'], rows(), thresholdNote, manhattanData.points.length);
            BioRouterViz.reportSize();
        });
    </script>
</body>
</html>
