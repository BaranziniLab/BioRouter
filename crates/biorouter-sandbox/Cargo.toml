[package]
name = "biorouter-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-scoped sandboxed execution for BioRouter agents (leaf crate; no engine deps)"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = "1.0"
tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# BR-69 Linux shell sandbox. Both are pure-Rust syscall wrappers (no C
# `libseccomp`/`libseccomp-dev` build dep, no runtime `.so`), so they cross-
# compile cleanly on the pinned `rust:1.92-bullseye` glibc-2.31 image and add
# nothing to the mac/Windows dependency graphs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
