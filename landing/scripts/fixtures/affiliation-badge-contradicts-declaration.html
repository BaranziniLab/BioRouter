<!--
  Fixture: the badge and the attribute name different institutions.

  Two sources for one fact drift, and the no-JS view reads the badge while the
  generator, registry.json and the daemon read the attribute. Published as-is
  this card tells a visitor its data sits under Stanford's agreements while the
  app enforces UCSF's — the affiliation equivalent of a "Public" chip over a
  private connector.

  See happy.html for why this comment spells out neither an opening div tag nor
  the wrapper id as an attribute.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="DriftedBadgeAgent" data-affiliation="ucsf">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Drifted Badge Agent</h3>
          <div class="ext-org">Fixtures · UCSF · v0.1.0</div>
        </div>
        <a href="https://example.invalid/drifted-badge-agent" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">A private card whose institution badge names an institution its own attribute does not.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag private" data-privacy-badge>Private</span><span class="tag affiliation" data-affiliation-badge="stanford">Stanford data</span><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/driftedbadgeagent.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

  </div>
</div>
