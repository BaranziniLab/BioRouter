<!--
  Fixture: a card wearing an institution badge it never declared.

  The dangerous direction of the affiliation-badge rule. Absent
  data-affiliation means UNCONSTRAINED, so this card paints a UCSF constraint
  onto the marketplace that the catalog does not record and the daemon will
  never enforce — a reader is told the flow is covered by agreements nobody
  wrote down. Without JavaScript the chip is the whole of what they are told.

  See happy.html for why this comment spells out neither an opening div tag nor
  the wrapper id as an attribute.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Unbacked Badge Agent</h3>
          <div class="ext-org">Fixtures · UCSF · v0.1.0</div>
        </div>
        <a href="https://example.invalid/unbacked-badge-agent" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">A card that declares no affiliation and wears an institution badge anyway.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag public" data-privacy-badge>Public</span><span class="tag affiliation" data-affiliation-badge="ucsf">UCSF data</span><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/unbackedbadgeagent.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

  </div>
</div>
