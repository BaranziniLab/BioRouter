<!--
  Fixture: the institution badge rendered from the slug instead of the display
  name.

  The whole reason INSTITUTIONS carries a `name` beside its `id` is that DR-26
  wants a cross-institutional warning to NAME the institutions rather than shrug
  at the user, and a raw slug is the shrug. A badge reading "ucsf data" is that
  slug arriving on the public marketplace, and it is invisible in review because
  it is one letter-case away from correct.

  See happy.html for why this comment spells out neither an opening div tag nor
  the wrapper id as an attribute.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="SluggedBadgeAgent" data-affiliation="ucsf">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Slugged Badge Agent</h3>
          <div class="ext-org">Fixtures · UCSF · v0.1.0</div>
        </div>
        <a href="https://example.invalid/slugged-badge-agent" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">A private card whose institution badge renders the id rather than the display name.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag private" data-privacy-badge>Private</span><span class="tag affiliation" data-affiliation-badge="ucsf">ucsf data</span><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/sluggedbadgeagent.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

  </div>
</div>
