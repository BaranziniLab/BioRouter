<!--
  Fixture: two cards declaring the same data-extension-name.

  Expected: exit 1 naming data-extension-name and both ids. The name is the join
  key between the published catalog and the installed config entry, so two cards
  claiming it means the tier lookup cannot tell the two extensions apart — and
  whichever one a user actually installed, they get the other one's answer.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="TwinAgent">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Twin Agent One</h3>
          <div class="ext-org">Fixtures · v0.1.0</div>
        </div>
        <a href="https://example.invalid/twin-one" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">The first of two cards claiming the same installed extension name.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/twinagent-one.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="twin agent">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Twin Agent Two</h3>
          <div class="ext-org">Fixtures · v0.1.0</div>
        </div>
        <a href="https://example.invalid/twin-two" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">The second card, whose name differs only by the whitespace and case the key drops.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/twinagent-two.brxt" class="brxt-chip">.brxt</a>

    </div>

  </div>
</div>
