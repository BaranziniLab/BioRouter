<!--
  Fixture: a private card that declares NO affiliation.

  Expected: exit 0, one extension, privacy private, and no `affiliation` key at
  all. Absent means unconstrained — any private model may use it — which is the
  correct default: most extensions carry no institutional constraint and must
  not all become cross-institutional mismatches on the day affiliation ships.

  The only private card in happy.html is affiliated, so without this fixture a
  generator that REQUIRED affiliation on every private entry would pass the
  whole suite.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="UnaffiliatedAgent">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Unaffiliated Agent</h3>
          <div class="ext-org">Fixtures · v0.1.0</div>
        </div>
        <a href="https://example.invalid/unaffiliated-agent" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">A private card under nobody's institutional agreements in particular.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag private" data-privacy-badge>Private</span><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/unaffiliatedagent.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

  </div>
</div>
