<!--
  Fixture: a card that DECLARES private and BADGES itself Public.

  The dangerous direction. The shelf re-renders from registry.json, which is
  generated from data-privacy, so with JavaScript on this card is labelled
  Private and everything looks right. With JavaScript off, the static markup is
  the entire page, nothing re-renders, and the visitor reads "Public" on a
  connector that reaches UCSF clinical data.

  Two sources for one fact is how they drift; the generator's job here is to
  refuse to publish while they disagree.
-->
<div id="extensions-section">
  <div class="ext-grid" id="extensions-grid">

    <div class="ext-card" data-license="Apache-2.0" data-privacy="private" data-extension-name="ContradictedAgent">
      <div class="ext-card-header">
        <div class="ext-meta">
          <h3>Contradicted Agent</h3>
          <div class="ext-org">Fixtures · v0.1.0</div>
        </div>
        <a href="https://example.invalid/contradicted-agent" class="ext-gh-link">GitHub</a>
      </div>
      <p class="ext-desc">A card whose attribute and whose badge name different tiers.</p>
      <div class="ext-footer">
        <div class="ext-tags"><span class="tag public" data-privacy-badge>Public</span><span class="tag mcp">MCP</span></div>
        <a href="https://example.invalid/contradictedagent.brxt" class="brxt-chip">.brxt</a>
      </div>
    </div>

  </div>
</div>
