<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="BioRouter BR app icon">
  <!--
    ============================================================================
    HOW THE SHIPPED RASTERS ARE BUILT (read before touching prepare.sh):
      The rasters (icon.png / icon@2x.png / icon.icns / icon.ico) are built by
      sips-/magick-resizing br-icon-beige.png (the 1024x1024 browser-rendered
      master), NOT by rasterizing THIS svg via sips. sips renders SVG <text>
      but FLATTENS font-weight — a weight-800 heavy B comes out medium — and
      the heavy weight is essential to this design. br-icon-beige.png was
      rendered through Chromium (-apple-system = SF Pro, honoring weight 800)
      and is the deterministic shippable master. This svg is the editable,
      browser-faithful source-of-truth for the mark; do NOT feed it to sips.
    ============================================================================
    macOS ICON SAFE-AREA INSET: the rounded plate sits at 100,100,824,824 in a
    1024 canvas (~100px transparent margin each side, rx ~185), the Big Sur+
    icon grid every native app follows. Full-bleeding the plate to the canvas
    made the dock icon read LARGER than neighbours (e.g. Chrome); the inset
    fixes that. The APPROVED INTERNAL proportions are unchanged - the BR mark
    keeps studio dials size 70 / offset -20 / gap 2, just scaled (824/500) and
    re-anchored inside the inset plate.
    ============================================================================
    FINALIZED BioRouter "BR" app icon - BEIGE PLATE variant.
    Colors: B #052049 (UCSF navy) | R #b85a32 (coral),
      split underline navy(left)/coral(right) at the B|R seam; plate #faf8f3.
    Letters "B" and "R", both CAPITALS, heavy weight 800, baseline-aligned.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#faf8f3"/>
  <g transform="translate(265 597.28)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif"
     font-weight="800">
    <text x="0" y="0" font-size="426.4376" fill="#052049">B</text>
    <text x="287.6665" y="0" font-size="315.5638" fill="#b85a32">R</text>
    <rect x="0" y="100.2777" width="282.7225" height="75.3546" fill="#052049"/>
    <rect x="282.7225" y="100.2777" width="211.2774" height="75.3546" fill="#b85a32"/>
  </g>
</svg>
