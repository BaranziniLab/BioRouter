<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="BioRouter BR app icon">
  <!--
    ============================================================================
    HOW THE SHIPPED RASTERS ARE BUILT (read before touching prepare.sh):
      The rasters (icon.png / icon@2x.png / icon.icns / icon.ico) are built by
      sips-/magick-resizing br-icon-beige.png (the 1024x1024 browser-rendered
      master), NOT by rasterizing THIS svg via sips. sips renders SVG <text>
      but FLATTENS font-weight — a weight-800 heavy B comes out medium — and
      the heavy weight is essential to this design. br-icon-beige.png was
      rendered through Chromium (-apple-system = SF Pro, honoring weight 800)
      and is the deterministic shippable master. This svg is the editable,
      browser-faithful source-of-truth for the mark; do NOT feed it to sips.
    ============================================================================
    FINALIZED BioRouter "BR" app icon - BEIGE PLATE variant.
    Approved spec (studio: docs/design/logo-icon-studio.html):
      mark size 70%   vertical offset -20px   underline gap 2%
    Colors: B #052049 (UCSF navy) | R #b85a32 (coral),
      split underline navy(left)/coral(right) at the B|R seam; plate #faf8f3.
    Letters "B" and "R", both CAPITALS, heavy weight 800, baseline-aligned.
  -->
  <rect x="6" y="6" width="500" height="500" rx="115" fill="#faf8f3"/>
  <g transform="translate(106.12 307.75)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif"
     font-weight="800">
    <text x="0" y="0" font-size="258.7606895444359" fill="#052049">B</text>
    <text x="174.55491638183594" y="0" font-size="191.48291026288254" fill="#b85a32">R</text>
    <rect x="0" y="60.84809692382812" width="171.55491638183594" height="45.72485504150391" fill="#052049"/>
    <rect x="171.55491638183594" y="60.84809692382812" width="128.20230865478516" height="45.72485504150391" fill="#b85a32"/>
  </g>
</svg>
